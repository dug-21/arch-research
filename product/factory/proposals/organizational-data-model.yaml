# ============================================================================

meta:
  name: organizational-data-model
  track: claude
  version: 3.0.0
  date: 2026-08-29
  status: directional · working model · not ratified · not implemented · not enforced
  theme: workflow-harness
  superseded_by: product/factory/proposals/codex-organizational-data-model-v4.yaml
  status_note: >
    Retained for lineage only. The converged line continues on the Codex track
    from v4; this track contributed the attenuation chain, standing/dynamic
    Delegation, inverse discipline, the firewall and extension invariants, and
    typed Attempt disposition. Do not edit further.
  derivation:
    - product/research/wfh-010/findings-W4-data-model.md            # + rework round 1
    - product/research/wfh-010/reports/gate-coverage-r2.md          # PASS
    - product/factory/proposals/agentic-organization-data-model.md  # core/supporting split, Delegation, Event consolidation
