# Organizational Data Model — V5
# Definitive working representation. Directional, not implemented or enforced.

meta:
  name: organizational-data-model
  track: converged
  version: 5.0.0
  date: 2026-08-29
  status: directional · working model · not ratified · not implemented · not enforced
  theme: workflow-harness
  derivation:
    - product/factory/proposals/organizational-data-model-v3.yaml
    - product/factory/proposals/organizational-data-model.yaml
    - product/factory/proposals/codex-organizational-data-model-v4.yaml
    - product/factory/proposals/codex-organizational-data-model-v4-review.md
    - product/factory/proposals/target-concept-v1.md
  enforcement_reality: >
    No common cross-program checker implements this model. Existing workflows,
    git/forge, Unimatrix, tests and human gates enforce fragments only.

principles:
  small_core: >
    Seven entities describe the organization: Scope, Goal, Capability, Actor,
    Unit, Event and Record. This is a hypothesis to test, not a fixed ceiling.
  supporting_definitions: >
    Workflow, Skill, Role, Delegation, Gate, EffectBoundary, Attempt and
    Technology make the core operational without redefining it.
  extend_by_registration: >
    Program variation normally enters through a registry or catalog, not a new
    entity or a change to common semantics.
  construct_admission_bar: >
    Admit a new construct only when it has independent identity, lifecycle,
    relations and behavior that cannot fit an existing construct or registered
    type without semantic distortion.
  separation_is_the_product: >
    Preserve competence/capability, claim/observation, delivery/proof,
    outcome/decision/consequence, intent/enforcement and record/effect.
  authority_chain: >
    Authority is rooted in Scope and reaches an Actor through Delegations that
    may not exceed their parents. Autonomy never implies effect authority.
  program_ownership: >
    Programs own Workflows, proof bars, Record Categories and domain extensions.
    The common model owns identity, relationships and invariants.
  method_custody: >
    A definition governing work is not writable by the activity it governs.
    Changes are authorized adaptation Events, never silent edits.
  inverse_relations: >
    Declare an inverse when it expresses meaningful domain navigation or
    constrains both sides, not merely because someone might query backward.

notation:
  status: RESOLVED (accepted for the working model) | OPEN (requires resolution or broader evidence)
  identity: opaque stable id, distinct from name, version and state
  versioned: immutable revisions under one identity
  fields: "name: {type, required, definition}"
  relations: "name: {target, cardinality, inverse, rule, attributes}"
  types: text · timestamp · digest · bool · ref<X> · list<ref<X>> · enum[...] · map

core:
  Scope:
    status: OPEN
    form: entity
    identity: scope_id
    versioned: true
    definition: An organizational boundary within which work, authority and information apply.
    fields:
      scope_type: {type: ref<registry.scope_type>, required: true}
      name: {type: text, required: true}
      objective: {type: text, required: false}
      authority_root_ref: {type: ref<Actor>, required: true, definition: holder of undelegated authority for this Scope}
      effective_at: {type: timestamp, required: true}
      expires_at: {type: timestamp, required: false}
    relations:
      parent: {target: Scope, cardinality: "0..1", inverse: contains, rule: acyclic within one baseline}
      contains: {target: Scope, cardinality: "0..*", inverse: parent}
    invariants: [I1, I17]
    open: [type-specific constraints, federation, authority-root succession, termination and transfer]

  Goal:
    status: RESOLVED
    form: entity
    identity: goal_id
    versioned: true
    definition: An intended outcome that defines what must become true. Intent, never a boundary.
    fields:
      statement: {type: text, required: true}
      scope_ref: {type: ref<Scope>, required: true}
      success_criteria: {type: text, required: true}
      claim_floor: {type: list<ref<Capability>>, required: true}
      north_star: {type: list<ref<Capability>>, required: false}
      lifecycle_state: {type: text, required: true}
    relations:
      requires: {target: Capability, cardinality: "0..*", inverse: required_by, rule: establishes Capability identity}
      is_advanced_by: {target: Capability, cardinality: "0..*", inverse: advances, rule: contribution only}
      directs: {target: Unit, cardinality: "0..*", inverse: directed_by, rule: never makes Goal the Unit Scope}
    invariants: [I13]

  Capability:
    status: RESOLVED
    form: entity
    identity: capability_id
    versioned: true
    definition: >
      An observable behavior required by at least one Goal, delivered by work
      and enabled by Technologies. Organizational level changes Scope and
      composition, never meaning.
    fields:
      name: {type: text, required: true}
      observable_behavior: {type: text, required: true}
      scope_ref: {type: ref<Scope>, required: true}
      classification_refs: {type: list<ref<registry.capability_classification>>, required: false}
      done_when: {type: text, required: true}
      grade: {type: ref<value.evidence_grade>, required: true}
      evidence_record_refs: {type: list<ref<Record>>, required: false}
    relations:
      required_by: {target: Goal, cardinality: "1..*", inverse: requires, rule: no requiring Goal means no Capability}
      advances: {target: Goal, cardinality: "0..*", inverse: is_advanced_by}
      composed_of: {target: Capability, cardinality: "0..*", rule: acyclic; each Capability remains independently observable}
      prerequisite_of: {target: Capability, cardinality: "0..*", rule: dependency is distinct from composition}
      delivered_by: {target: Unit, cardinality: "0..*", inverse: delivers, rule: delivery does not prove}
      enabled_by: {target: Technology, cardinality: "0..*", inverse: enables, rule: no grade transfer}
    extension_owner: {behavior_schema: program, evidence_bar: program, classification: registry}
    invariants: [I9, I13, I14]
    open: [recursive evidence rollup, parent-child done_when, Scope expiry]

  Actor:
    status: OPEN
    form: entity
    identity: actor_id
    versioned: false
    definition: A human, agent, service or deterministic component participating in work or effects.
    fields:
      name: {type: text, required: true}
      actor_type: {type: "enum[human,agent,service,deterministic-component]", required: true}
      declared_identity: {type: text, required: true, definition: persisted self-assertion; never attestation or authority}
      lifecycle_state: {type: text, required: true}
    relations:
      has_skill: {target: Skill, cardinality: "0..*", inverse: held_by, attributes: [evidence_refs, grade, currentness, expires_at]}
      holds_role: {target: Role, cardinality: "0..*", attributes: [scope_ref, effective_at, expires_at]}
      receives: {target: Delegation, cardinality: "0..*", rule: authority reaches an Actor only through Scope root or Delegation}
    invariants: [I10, I12, I17]
    open: [identity attestation, replacement and continuity, composite Actors]

  Unit:
    status: OPEN
    form: entity
    identity: unit_id
    versioned: true
    definition: One durable, attributable piece of work with a defined intended outcome.
    fields:
      unit_kind: {type: ref<registry.unit_kind>, required: true}
      intended_outcome: {type: text, required: true, definition: changing it creates a new Unit}
      scope_ref: {type: ref<Scope>, required: true}
      current_state: {type: text, required: true, definition: Workflow-owned}
      baseline_ref: {type: text, required: true}
    relations:
      directed_by: {target: Goal, cardinality: "0..*", inverse: directs}
      follows: {target: Workflow, cardinality: "1", inverse: governs}
      depends_on: {target: Unit, cardinality: "0..*", rule: DAG per Workflow baseline}
      attempts: {target: Attempt, cardinality: "0..*", inverse: unit, rule: at most one active unless Workflow permits concurrency}
      assigned_through: {target: Delegation, cardinality: "0..*", inverse: unit}
      gated_by: {target: Gate, cardinality: "0..*", inverse: evaluates, rule: inverse applies to the Unit subset of Gate.evaluates}
      consumes: {target: Record, cardinality: "0..*", rule: admission and currentness remain explicit}
      produces: {target: Record, cardinality: "0..*", rule: production implies neither admission nor truth}
      delivers: {target: Capability, cardinality: "0..*", inverse: delivered_by}
      replaces: {target: Unit, cardinality: "0..1", rule: used when intended outcome changes}
    extension_owner: {unit_kind: workflow, states: workflow, transitions: workflow}
    invariants: [I6, I15, I16]
    open: [interruption and resume, concurrent Attempts, partial-output admission]

  Event:
    status: RESOLVED
    form: event
    identity: {field: event_id, required_when: consequential or acknowledgement/replay/audit matters, otherwise: may be ephemeral}
    versioned: false
    definition: An immutable occurrence within a Scope. Event type selects a registered extension, never a core noun.
    fields:
      event_type: {type: ref<registry.event_type>, required: true}
      occurred_at: {type: timestamp, required: true}
      recorded_at: {type: timestamp, required: true}
      scope_ref: {type: ref<Scope>, required: true}
      actor_refs: {type: list<ref<Actor>>, required: true}
      subject_refs: {type: list, required: true}
      authority_ref: {type: "ref<Delegation|Scope>", required: false, definition: required for decisions and effect requests}
      epistemic_kind: {type: ref<value.epistemic_kind>, required: false}
      significance: {type: ref<value.significance>, required: true}
      carrier: {type: ref<value.carrier>, required: true}
      custody: {type: text, required: true}
      extension: {type: map, required: true, definition: payload fields required by the registered Event type}
    relations:
      documented_by: {target: Record, cardinality: "0..*", inverse: documents}
      caused_by: {target: Event, cardinality: "0..*"}
      correlated_with: {target: Event, cardinality: "0..*", rule: never implies causation}
      supersedes: {target: Event, cardinality: "0..1", rule: correction is a new Event}
    extension_owner: {event_type: registry}
    invariants: [I4, I5, I6]
    open: [durable identity threshold, admission, retention, ordering and clock semantics]

  Record:
    status: OPEN
    form: entity
    identity: record_id
    versioned: true
    definition: Durable information governed by an extensible Category.
    fields:
      category: {type: ref<registry.record_category>, required: true}
      category_schema_version: {type: text, required: true}
      scope_ref: {type: ref<Scope>, required: true}
      author_or_source_ref: {type: text, required: true}
      created_at: {type: timestamp, required: true}
      content_digest: {type: digest, required: true}
      epistemic_kind: {type: ref<value.epistemic_kind>, required: true}
      evidence_altitude: {type: "enum[directional,behavioral]", required: true}
      lifecycle_state: {type: text, required: true, definition: Category-owned}
      currentness: {type: ref<value.currentness>, required: true}
      provenance_refs: {type: list, required: true}
      missing_or_unavailable_refs: {type: list<text>, required: false}
    relations:
      documents: {target: Event, cardinality: "0..*", inverse: documented_by}
      admitted_by: {target: Event, cardinality: "0..*", rule: assessment Events only; existence is not admission}
      supersedes: {target: Record, cardinality: "0..*", rule: correction never overwrites history}
    extension_owner: {schema: category, admission: category, retrieval: category, lifecycle: category, correction: category}
    invariants: [I2, I3, I8]
    open: [Category configuration, admission rules, lesson-learned versus pattern boundary]

supporting:
  Workflow:
    status: OPEN
    form: entity
    owner: Program
    identity: workflow_id
    versioned: true
    definition: An end-to-end methodology by which a class of Goals is pursued through Units, dependencies, Skills and Gates.
    fields:
      name: {type: text, required: true}
      method_statement: {type: text, required: true}
      owner_scope_ref: {type: ref<Scope>, required: true}
      unit_kinds: {type: list<ref<registry.unit_kind>>, required: true}
      dependency_rules: {type: list, required: true}
      state_vocabulary: {type: list<text>, required: true}
      definition_custodian_ref: {type: ref<Actor>, required: true}
    relations:
      applies_to: {target: Goal, cardinality: "0..*"}
      requires: {target: Skill, cardinality: "0..*", inverse: required_by}
      binds: {target: Gate, cardinality: "0..*", inverse: bound_by}
      governs: {target: Unit, cardinality: "0..*", inverse: follows}
      supersedes: {target: Workflow, cardinality: "0..1", rule: change is an adaptation Event}
    extension_owner: {unit_kinds: program, states: program, dependency_rules: program}
    invariants: [I18, I19]
    open: [method admission and improvement evidence, cross-program reuse]

  Skill:
    status: OPEN
    form: entity
    owner: Collective or Program
    identity: skill_id
    versioned: true
    definition: A specialty required to perform a class of work. Competence, never Capability, authority or Workflow.
    fields:
      name: {type: text, required: true}
      work_class: {type: text, required: true}
      definition_record_ref: {type: ref<Record>, required: false}
      required_tool_classes: {type: list<text>, required: false}
      local_binding: {type: map, required: false}
    relations:
      required_by: {target: "Role|Workflow|Unit", cardinality: "0..*"}
      held_by:
        target: Actor
        cardinality: "0..*"
        inverse: has_skill
        attributes: [evidence_refs, grade, currentness, expires_at]
        rule: possession grants neither authority nor Capability proof
    invariants: [I10]
    open: [shared catalog, repository-local binding, admission and evidence]

  Role:
    status: OPEN
    form: entity
    owner: Program
    identity: role_id
    versioned: true
    definition: A reusable organizational responsibility with required Skills. Decision latitude arrives through a standing Delegation.
    fields:
      name: {type: text, required: true}
      responsibility: {type: text, required: true}
      independence_constraints: {type: list<text>, required: false}
    relations:
      requires: {target: Skill, cardinality: "0..*", inverse: required_by}
      assigned_to: {target: Actor, cardinality: "0..*", inverse: holds_role, rule: scoped and time-bounded}
      receives: {target: Delegation, cardinality: "0..*", inverse: grantee, rule: standing Delegations only}
    invariants: [I10, I12]
    open: [composition, incompatible-role enforcement, program-local versus collective]

  Delegation:
    status: OPEN
    form: entity
    owner: Program or Workflow
    identity: delegation_id
    versioned: true
    definition: >
      A grant of work and limits from grantor to grantee. Standing when it names
      a Role and no Unit; dynamic when it names an Actor and a Unit.
    fields:
      autonomy_tier: {type: ref<value.autonomy_tier>, required: true}
      effect_grants: {type: list<ref<registry.effect_class>>, required: true}
      resource_ceiling: {type: map, required: true}
      escalation_conditions: {type: list<text>, required: true}
      effective_at: {type: timestamp, required: true}
      expires_at: {type: timestamp, required: false}
      definition_custodian_ref: {type: ref<Actor>, required: true}
    relations:
      grantor: {target: Actor, cardinality: "1", rule: or the Scope authority root acting}
      grantee: {target: "Role|Actor", cardinality: "1"}
      scope: {target: Scope, cardinality: "1"}
      unit: {target: Unit, cardinality: "0..1", inverse: assigned_through, rule: absent means standing; present means dynamic}
      derived_from: {target: Delegation, cardinality: "0..1", rule: may not exceed parent on any axis}
      governs: {target: Attempt, cardinality: "0..*", inverse: governed_by}
      enforced_by: {target: EffectBoundary, cardinality: "0..*", inverse: enforces, rule: without a boundary authority is declared only}
    invariants: [I12, I17, I18]
    open: [attenuation comparison, revocation propagation, sub-delegation depth]

  Gate:
    status: OPEN
    form: entity
    owner: Workflow
    identity: gate_id
    versioned: true
    definition: A rule for evaluating an identified subject and baseline before a boundary may be crossed.
    fields:
      subject_rule: {type: text, required: true}
      baseline_rule: {type: text, required: true}
      eligible_evidence: {type: list, required: true}
      missingness_policy: {type: text, required: true}
      independence_predicate: {type: text, required: true}
      procedure: {type: "enum[deterministic,judgment]", required: true}
      bar: {type: text, required: true}
      allowed_outcomes: {type: list<text>, required: true}
      outcome_consequences: {type: map, required: true}
      required_record_category: {type: ref<registry.record_category>, required: true}
      definition_custodian_ref: {type: ref<Actor>, required: true}
    relations:
      requires_assessor: {target: Role, cardinality: "1"}
      bound_by: {target: Workflow, cardinality: "0..1", inverse: binds}
      evaluates: {target: "Unit|Record|Capability|Event", cardinality: "0..*", inverse: Unit.gated_by, rule: inverse applies only when the target is Unit}
    extension_owner: {procedure: workflow, bar: workflow, outcomes: workflow, consequences: workflow}
    invariants: [I6, I7, I8, I9, I18]
    open: [deterministic versus judgment procedures, portability, external enforcement]

  EffectBoundary:
    status: OPEN
    form: entity
    owner: Collective
    identity: effect_boundary_id
    versioned: false
    definition: The independently controlled system or authority boundary that can perform or refuse an effect.
    fields:
      name: {type: text, required: true}
      effect_classes: {type: list<ref<registry.effect_class>>, required: true}
      custody: {type: text, required: true}
      can_refuse: {type: bool, required: true, definition: a boundary that cannot refuse enforces nothing}
    relations:
      enforces: {target: Delegation, cardinality: "0..*", inverse: enforced_by}
    invariants: [I12]
    open: [refusal evidence, attestation, common effect taxonomy]

  Attempt:
    status: RESOLVED
    form: entity
    owner: Workflow
    identity: attempt_id
    versioned: false
    definition: One execution of a Unit against an identified baseline. Not a Unit subtype.
    fields:
      baseline_ref: {type: text, required: true}
      started_at: {type: timestamp, required: true}
      ended_at: {type: timestamp, required: false}
      disposition: {type: "enum[continue,hold,cancel,rework,complete]", required: true}
      resume_requirements: {type: map, required: false, definition: "baseline, preconditions, unresolved residue and next admissible transition"}
    relations:
      unit: {target: Unit, cardinality: "1", inverse: attempts}
      actors: {target: Actor, cardinality: "1..*"}
      governed_by: {target: Delegation, cardinality: "1..*", inverse: governs, rule: pins immutable versions}
      produces: {target: Record, cardinality: "0..*"}
    invariants: [I15]

  Technology:
    status: OPEN
    form: entity
    owner: Program
    identity: technology_id
    versioned: true
    definition: A reusable mechanism that may enable one or more Capabilities.
    fields:
      name: {type: text, required: true}
      grade: {type: ref<value.evidence_grade>, required: true}
      constraints: {type: text, required: false}
      evidence_record_refs: {type: list<ref<Record>>, required: false}
    relations:
      enables: {target: Capability, cardinality: "0..*", inverse: enabled_by, rule: no grade transfer}
    invariants: [I11]
    open: [adopted component versus conceptual mechanism, expiry and reassessment]

registries:
  scope_type:
    status: OPEN
    shape: {key: text, definition: text, required_fields: list<text>, constraints: list<text>, status: text}
    admission_rule: >
      Add only when boundary, authority or lifecycle behavior differs. This open
      registry supersedes wfh-010 RW1-D2's exactly-four set; its four types remain
      the initial hypothesis rather than a closed taxonomy.
    seeded:
      collective: {definition: complete organization under one authority root, required_fields: [], constraints: [], status: OPEN}
      program: {definition: durable area responsible for an objective and continuing work, required_fields: [], constraints: [], status: OPEN}
      mission: {definition: bounded organizational effort formed to achieve an outcome, required_fields: [], constraints: [], status: OPEN}
      team: {definition: bounded composition of Actors within another Scope, required_fields: [], constraints: [], status: OPEN}
  capability_classification:
    status: OPEN
    shape: {key: text, dimension: text, definition: text, status: text}
    admission_rule: Add an orthogonal classification without changing Capability meaning.
    seeded:
      functional: {dimension: quality, definition: behavior provided, status: OPEN}
      nonfunctional: {dimension: quality, definition: quality or constraint on behavior, status: OPEN}
      threshold: {dimension: proof_shape, definition: discrete bar, status: OPEN}
      curve: {dimension: proof_shape, definition: measured continuum, status: OPEN}
  event_type:
    status: OPEN
    shape: {key: text, definition: text, required_extension: list<text>, durable: text, status: text}
    admission_rule: Add a distinct occurrence schema, never another core noun.
    seeded:
      communication: {definition: information conveyed between participants, required_extension: [sender, route_or_topic, recipients, acknowledgement_requirement], durable: when-consequential, status: OPEN}
      decision: {definition: authority holder selects a consequential disposition, required_extension: [authority_ref, disposition, authorized_refs], durable: always, status: OPEN}
      observation: {definition: fact mechanically captured from an identified source, required_extension: [instrument, subject, capture_custody, raw_evidence_ref], durable: always, status: OPEN}
      assessment: {definition: an evaluation of a subject and pinned baseline under a Gate, required_extension: [gate_version_ref, subject_baseline, evidence_set, assessor_refs, independence_check], durable: always, status: OPEN}
      gate_outcome:
        definition: a terminal outcome issued for an assessment
        required_extension: [assessment_ref, outcome, missingness, consequence_disposition]
        durable: always
        status: OPEN
        rule: outcome vocabulary resolves through the assessment's pinned gate_version_ref to that Gate version's allowed_outcomes
      transition: {definition: Unit moves between Workflow-owned states, required_extension: [unit_ref, prior_state, next_state, authorization_ref], durable: always, status: OPEN}
      effect_request: {definition: consequential effect requested from an EffectBoundary, required_extension: [requested_effect, delegation_ref, target_boundary_ref], durable: always, status: OPEN}
      effect_disposition: {definition: "EffectBoundary performs, refuses or cannot determine a request", required_extension: [request_ref, boundary_ref, disposition, coupling], durable: always, status: OPEN}
      adaptation: {definition: "authorized change to a definition, baseline, composition or method", required_extension: [decision_ref, affected_refs, prior_baseline, new_baseline, resume_conditions], durable: always, status: OPEN}
  record_category:
    status: OPEN
    shape: {key: text, definition: text, schema_extension: map, admission_rule: text, retrieval: text, lifecycle: text, correction: text, status: text}
    admission_rule: A Category earns existence through different behavior, never label alone.
    seeded: {}
  unit_kind:
    status: OPEN
    shape: {key: text, definition: text, workflow_ref: ref<Workflow>, required_fields: list<text>, status: text}
    admission_rule: Add a work shape with distinct Workflow semantics; software Feature belongs here.
    seeded: {}
  effect_class:
    status: OPEN
    shape: {key: text, definition: text, target_schema: map, receipt_requirements: map, status: text}
    admission_rule: Add an externally distinguishable effect governed by Delegation and EffectBoundary.
    seeded: {}

catalogs:
  skill: {construct: Skill, scope: "collective|program", status: OPEN}
  workflow: {construct: Workflow, scope: program, status: OPEN}
  gate: {construct: Gate, scope: "program|workflow|record-category", status: OPEN}

values:
  autonomy_tier:
    status: OPEN
    definition: Initiative and decision latitude carried by Delegation. Never effect authority.
    values:
      A0: {definition: "analyze, evaluate or recommend without discretionary work initiation", status: OPEN}
      A1: {definition: exercise bounded judgment within an assigned Unit, status: OPEN}
      A2: {definition: plan and delegate within an approved Mission, status: OPEN}
      A3: {definition: "adapt local tactics, composition or reversible method detail", status: insufficient-evidence}
      A4: {definition: select and launch Missions within an approved Program, status: insufficient-evidence}
      A5: {definition: "change Collective policy, authority structures or strategic objectives", status: OPEN, held_by: human}
  evidence_grade:
    status: RESOLVED
    values: [missing, claimed, partial, proven]
    rule: proven requires evidence at the claim's altitude demonstrated by the organization
  epistemic_kind:
    status: OPEN
    values: [mechanical-observation, reported-observation, claim, inference, reviewed-finding]
    rule: independent of Event type, significance, authority and carrier; decision is an Event type, never an epistemic kind
  significance: {status: OPEN, values: [routine, exception, surprise]}
  carrier: {status: OPEN, values: [inline, record-ref, artifact-ref]}
  currentness: {status: OPEN, values: [current, superseded, stale, unknown]}
  coupling:
    status: OPEN
    values: [atomic, ordered-best-effort, reported, unknown]
  effect_disposition:
    status: OPEN
    values: [performed, refused, unknown]
    rule: effect_disposition Events use this common vocabulary; gate outcomes instead use the pinned Gate version's allowed_outcomes

invariants:
  I1: Every durable identity is opaque and distinct from name and version; history is superseded, never overwritten.
  I2: Record existence, admission, truth, grade, currentness and effect occurrence are independent facts.
  I3: Categories own schema, admission, retrieval, lifecycle and correction.
  I4: Mechanical observation requires capture provenance; an actor-authored account is a claim or inference.
  I5: Events are immutable; correction is a new Event; occurrence does not establish payload truth.
  I6: Outcome, decision, transition, effect request, effect disposition and Record remain distinct.
  I7: Gates fail closed when required independence or evidence cannot be established.
  I8: Missing evidence is explicit and never inferred as success.
  I9: Proven requires evidence at the claim's own altitude, demonstrated by the organization.
  I10: Skill represents competence and never Capability or authority.
  I11: Technology represents a mechanism and neither becomes nor proves Capability.
  I12: Autonomy is not authority; only an EffectBoundary disposition demonstrates enforced authority.
  I13: Every Capability is required by at least one Goal.
  I14: Capability meaning does not change with organizational level.
  I15: Unit identity survives retry and rework; each execution is an Attempt.
  I16: Changing a Unit's intended outcome creates a new Unit.
  I17: A derived Delegation may not exceed its parent; authority reaches an Actor through a chain from a Scope root.
  I18: Workflow, Gate and Delegation custody sits outside the governed activity; changes are adaptation Events.
  I19: Program extensions may not weaken common invariants or move their semantics into free text.

excluded:
  - Feature as a construct; it is a software unit_kind
  - Qualification as a construct; evidence belongs to Actor-has-Skill
  - Envelope as a construct; limits travel with Delegation
  - AuthorityBasis as a construct; authority is rooted in Scope or conveyed by Delegation
  - EvidenceItem as a construct; evidence is a Record role under a Gate
  - RecordVersion as a construct; versions belong to Record identity
  - Signal, Decision, Transition, Assessment, Outcome, EffectRequest or EffectReceipt as constructs; all are Events
  - a merged effect event; request and disposition remain separate
  - organizational-level Capability kinds, Goal as Scope, Attempt as Unit subtype, lesson as Event type
  - a universal lifecycle, state machine, proof bar or closed extension taxonomy
  - autonomy as effect authority or evidence strength

open:
  delegation_attenuation: comparison of non-numeric grants and revocation propagation
  workflow_promotion: Workflow requires adjudication as a common supporting definition
  custody_enforcement: no common enforcement point exists today
  event_identity_threshold: which Events require durable identity
  gate_identity: independent identity versus versioned Workflow rule
  skill_catalog: shared catalog with repository-local bindings remains untested
  lesson_vs_pattern: insufficient evidence for a behavioral distinction
  collective_boundary: authority-root succession and membership remain unresolved
  autonomy_A3_A4: insufficient evidence
  capability_rollup: recursive composition and evidence rollup remain unexecuted
  semantic_compression: seven-entity hypothesis is not proven generally

changelog:
  - version: 5.0.0
    date: 2026-08-29
    change: >
      Bound invariants and extension ownership to constructs; restored form and
      split assessment from gate_outcome. Corrected Event authority to Scope or
      Delegation, made standing Delegations navigable from Role, completed
      semantic inverses, defined extension payload and effect disposition, made
      Scope seeds conform, recorded the open Scope taxonomy supersession, and
      made independently testable invariants atomic. Added the rule that inverses
      express domain semantics rather than backward query convenience.
  - version: 4.0.0
    date: 2026-08-29
    change: >
      Converged the Codex and Claude V3 tracks. Retained seven core entities as
      a testable hypothesis; adopted standing/dynamic Delegation, attenuation,
      rigorous Gate and Attempt semantics, and explicit enforcement. Restored
      registry and catalog extensibility, retained EffectBoundary naming,
      narrowed Skill to specialty, merged assessment with its terminal outcome,
      and made Capability classifications registered rather than fixed.
