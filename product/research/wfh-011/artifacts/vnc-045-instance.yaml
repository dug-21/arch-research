  exactly [enhancement, vinculum, goal:knowledge-integrity]; and AR-02 recommended (1)
  resolving the "audit is the PRIMARY control vs fire-and-forget discarded write"
  contradiction - ADR-008 point 5 still reads "Audit is the PRIMARY control" and ADR-009
  still specifies "fire-and-forget after commit", with RISK-TEST-STRATEGY Residual Risk 2
  accepting that the event can drop. Non-adoption of an advisory review is CONFORMING
  behaviour, not a defect; it is recorded here because it is the case's clearest
  demonstration that assessment, outcome and consequence are separable (M01 I6).

