# ---------------------------------------------------------------------------
# supporting.Workflow    (owner: Program)
# ---------------------------------------------------------------------------
workflows:
  - id: WF-01
    name: uni design session (Session 1)
    method_statement: >
      Phase 1 scope -> Phase 1b scope risk -> Phase 2a architect+spec (parallel) ->
      Phase 2a+ risk strategy -> Phase 2b vision alignment -> Phase 2c synthesis ->
      Phase 2c+ advisory product review -> Phase 2d return to human. No git operations;
      artefacts remain untracked until the delivery session commits them.
    owner_scope_ref: SC-02
    unit_kinds: [feature]
    dependency_rules:
      - Phase 2a requires human approval of SCOPE.md.
      - Synthesis regenerates IMPLEMENTATION-BRIEF and ACCEPTANCE-MAP from source documents.
      - A human technical change updates the source document first, then re-runs the synthesizer.
    state_vocabulary: [scope, scope-review, design, design-review, spec]
    definition_custodian_ref: AC-01
    applies_to: [GO-01]
    requires: missing-history
    binds: [GT-01, GT-02, GT-03]
    governs: [UN-01]
    supersedes: null
    provenance: repo-artifact (T02)
    custody_witness: >
      CONFORMING to M01 I18. PR #929 changed 57 files; none is under .claude/. The governed
      activity did not edit its governing definition. Mechanically verified from the PR files
      dump. This is the strongest demonstrated I18 witness in the case.

  - id: WF-02
    name: uni delivery session (Session 2)
    method_statement: >
      Stage 3a component design -> Gate 3a (MANDATORY BLOCK) -> Stage 3b wave-based
      implementation -> Gate 3b -> Stage 3c testing -> Gate 3c -> Phase 4 delivery
      (branch, commit, PR, security review, advisory product review, human merge).
    owner_scope_ref: SC-02
    unit_kinds: [feature, stage, implementation-wave]
    dependency_rules:
      - Gate 3a must PASS before Stage 3b begins.
      - Waves execute sequentially; components inside a wave are independent and parallel.
      - Max 2 rework iterations per gate; exceeding it escalates to SCOPE FAIL and stops.
      - Gates check committed HEAD; working-tree changes are invisible to them.
      - Merge -> close cycle -> retro, in that strict order.
    state_vocabulary: [spec, spec-review, develop, test, pr-review]
    definition_custodian_ref: AC-01
    applies_to: [GO-01]
    requires: missing-history
    binds: [GT-04, GT-05, GT-06, GT-07, GT-08]
    governs: [UN-02, UN-03, UN-04, UN-05, UN-06, UN-07, UN-08]
    supersedes: null
    provenance: repo-artifact (T01)
    traversal_note: >
      Goal -> applicable Workflows (M02 required traversal) resolves here WITHOUT a new inverse
      relation: Workflow.applies_to is a declared one-way relation, so the traversal is an index
      over workflows filtered on applies_to. Demonstrated in traversal-check below.

