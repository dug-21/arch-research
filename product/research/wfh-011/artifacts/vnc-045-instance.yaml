# ---------------------------------------------------------------------------
# Program-owned registry extensions (registered, not new common constructs)
# ---------------------------------------------------------------------------
registry_extensions:

  unit_kind:            # M01 registries.unit_kind.seeded == {} ; program must register
    feature:
      definition: One tracked product change with an issue, a branch and a PR.
      workflow_ref: WF-02
      required_fields: [intended_outcome, baseline_ref]
      status: registered-by-instance
      provenance: inference   # from T01 uni-delivery-protocol + observed vnc-045 shape
    stage:
      definition: One protocol-defined phase of a feature terminated by a Gate.
      workflow_ref: WF-02
      required_fields: [intended_outcome, baseline_ref]
      status: registered-by-instance
      provenance: repo-artifact   # T01 "Stage 3a / 3b / 3c", each with a gate
    implementation-wave:
      definition: >
        A dependency-ordered group of components implemented in parallel inside Stage 3b
        and committed before the next wave begins.
      workflow_ref: WF-02
      required_fields: [intended_outcome, depends_on]
      status: registered-by-instance
      provenance: repo-artifact   # T01 "Wave Planning (MANDATORY)"; S03 Component Map waves 1/2/3

  record_category:      # M01 registries.record_category.seeded == {} ; category owns behaviour
    scope-definition:
      definition: The human-locked statement of what a feature will and will not do.
      admission_rule: Admitted by explicit human approval at the Session-1 human gate.
      lifecycle: Revised only by an authorized human scope decision; derived records regenerate.
      correction: In-place revision by the synthesizer under a human decision (observed).
      retrieval: product/features/{id}/SCOPE.md
      custodian: AC-01
      status: registered-by-instance
    design-source:
      definition: Architecture, Specification, Risk-Test Strategy, ADRs, pseudocode, test plans.
      admission_rule: Admitted by the Gate 3a assessment.
      lifecycle: Regenerated from SCOPE on an authorized scope change.
      correction: Overwrite-in-place by the authoring role (observed).
      retrieval: product/features/{id}/{architecture,specification,pseudocode,test-plan}/**
      status: registered-by-instance
    agent-report:
      definition: An actor's own account of what it did, produced at the end of its Attempt.
      admission_rule: NONE OBSERVED - written and committed without any admission event.
      lifecycle: NONE OBSERVED - never superseded, never marked stale, never regenerated.
      correction: NONE OBSERVED.
      retrieval: product/features/{id}/agents/**
      status: registered-by-instance
      distinct_behaviour_evidence: >
        Earns a Category under M01 registries.record_category.admission_rule by behaviour,
        not label: three reports in the merged tree describe a superseded scope and carry no
        currentness marker (see RC-11, RC-12, RC-13).
    gate-assessment:
      definition: An independent validator's assessment of a pinned subject under a Gate.
      admission_rule: Produced by the assessor named in Gate.requires_assessor.
      lifecycle: Terminal for the gate iteration; a rework produces a new iteration.
      correction: Not corrected; a re-check is a new assessment.
      retrieval: product/features/{id}/reports/gate-*-report.md
      status: registered-by-instance
    test-observation-report:
      definition: An actor-authored account of a deterministic test run.
      admission_rule: Consumed by Gate 3c (T01) - not observed to have been consumed here.
      lifecycle: One per Stage-3c execution.
      correction: Not observed.
      retrieval: product/features/{id}/testing/RISK-COVERAGE-REPORT.md
      status: registered-by-instance
      distinct_behaviour_evidence: >
        Distinct because its epistemic_kind is fixed at reported-observation: the raw runner
        output is not retained anywhere in the alphabet, so it can never be a
        mechanical-observation under M01 I4.
    advisory-review:
      definition: A fresh-context product review that is explicitly non-binding.
      admission_rule: None; posted as a forge comment and relayed verbatim.
      lifecycle: Never superseded; supersession by later reviews is not marked.
      correction: Not observed.
      retrieval: GitHub issue/PR comments
      status: registered-by-instance
      distinct_behaviour_evidence: >
        T01 Product Review Rules: "Advisory - does not block delivery" and the leader
        "NEVER parses, acts on, or gates on it."
    forge-record:
      definition: Issue, PR, review, commit and merge metadata held by the forge.
      admission_rule: Written by the forge on the event; not authorable by the program.
      lifecycle: Append-only from the program's side.
      correction: Not available to the program.
      retrieval: GitHub REST API
      custodian: EB-01
      status: registered-by-instance

  effect_class:         # M01 registries.effect_class.seeded == {} ; program must register
    forge-merge:
      definition: Integrating a pull request's changes into a protected default branch.
      target_schema: {repository: text, pr_number: integer, base_ref: text, head_ref: text}
      receipt_requirements: {merge_commit_sha: digest, merged_at: timestamp, merged_by: text}
      status: registered-by-instance
    forge-issue-state:
      definition: Closing or reopening a tracked issue.
      target_schema: {repository: text, issue_number: integer}
      receipt_requirements: {state: text, state_reason: text, closed_at: timestamp, closed_by: text}
      status: registered-by-instance
    repository-write:
      definition: Creating a commit on a branch of the repository.
      target_schema: {repository: text, ref: text}
      receipt_requirements: {commit_sha: digest, author: text, committer: text, committed_at: timestamp}
      status: registered-by-instance
    knowledge-store-write:
      definition: Storing or correcting an entry in the Unimatrix knowledge store.
      target_schema: {entry_id: integer, operation: text}
      receipt_requirements: {audit_event: map}
      status: registered-by-instance
      note: >
        Registered because S05 reports claim entries #5599-#5613 were stored, but no receipt
        for any of those writes exists inside the fixed alphabet. See EV-30.

  scope_type:
    # M01 seeds collective/program/mission/team are used as seeded; none added.
    used_seeds: [collective, program, mission]
    unused_seeds:
      team: >
        not-applicable in this case. The delivery "swarm" is a set of per-Attempt agent
        spawns with no durable membership, no boundary of its own and no authority root;
        nothing in the alphabet evidences a Scope whose lifecycle differs from the mission.

  capability_classification:
    used_seeds: [functional, nonfunctional, threshold, curve]

