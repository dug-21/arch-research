# ---------------------------------------------------------------------------
# supporting.Gate
# ---------------------------------------------------------------------------
gates:
  # GT-01..GT-03 are NOT modelled as Gates. See advisory_reviews below.
  - id: GT-04
    name: Gate 3a - design review
    subject_rule: "product/features/{id}/pseudocode/** and test-plan/** at committed HEAD."
    baseline_rule: "Gates check committed HEAD; working-tree changes are invisible to them (T01)."
    eligible_evidence: [ARCHITECTURE.md, SPECIFICATION.md, RISK-TEST-STRATEGY.md, pseudocode/**, test-plan/**]
    missingness_policy: missing-history
    independence_predicate: "assessor is a uni-validator spawn distinct from the Stage-3a agents"
    procedure: judgment
    bar: "Five checks: architecture alignment, spec coverage, risk coverage, interface consistency, knowledge stewardship."
    allowed_outcomes: [PASS, REWORKABLE FAIL, SCOPE FAIL]
    outcome_consequences:
      PASS: "phase-end spec-review->develop; commit; proceed to Stage 3b"
      REWORKABLE FAIL: "loop back to Stage 3a agents, max 2 iterations"
      SCOPE FAIL: "session stops; return to human"
    required_record_category: gate-assessment
    definition_custodian_ref: AC-01
    requires_assessor: RO-09
    bound_by: WF-02
    evaluates: [UN-03]
    observed_outcomes:
      - {iteration: 0, outcome: REWORKABLE FAIL, failing_check: "4 interface consistency", record: missing-history}
      - {iteration: 1, outcome: PASS, record: RC-08}
    provenance: repo-artifact
    baseline_gap: >
      RC-08 pins no commit. Both iterations occurred before any commit existed (design
      artefacts are untracked until Session 2 commits them - T02), and both collapse into
      3afc2c49. Gate.baseline_rule is therefore stated but unsatisfiable at iteration 0,
      and the iteration-0 assessment Record does not survive.

  - id: GT-05
    name: Gate 3b - code review
    subject_rule: "committed HEAD of feature/vnc-045"
    baseline_rule: "committed HEAD; leader commits modified production files pre-gate (T01)"
    eligible_evidence: [pseudocode/**, test-plan/**, ARCHITECTURE.md, SPECIFICATION.md, RISK-TEST-STRATEGY.md, source diff, cargo build/clippy/audit output]
    missingness_policy: missing-history
    independence_predicate: "assessor is vnc-045-gate-3b, distinct from the wave implementers"
    procedure: judgment
    bar: "Seven checks; WARNs are non-blocking."
    allowed_outcomes: [PASS, REWORKABLE FAIL, SCOPE FAIL]
    outcome_consequences:
      PASS: "phase-end develop->test; commit; proceed to Stage 3c"
      REWORKABLE FAIL: "loop back, max 2 iterations"
      SCOPE FAIL: "stop"
    required_record_category: gate-assessment
    definition_custodian_ref: AC-01
    requires_assessor: RO-09
    bound_by: WF-02
    evaluates: [UN-04]
    observed_outcomes:
      - {iteration: 0, outcome: PASS, record: RC-09, warns: 3}
    provenance: repo-artifact
    stale_baseline_finding: >
      DEMONSTRATED. RC-09 records as an open WARN a stale `#[allow(dead_code)]` on
      ServiceLayer.store_tag and recommends "Drop the attribute + comment in a cleanup edit."
      Commit 843d0049 (2026-07-07 03:50:17 +0000, PR-head ref) had already removed exactly
      that attribute; RC-09 was committed at bf7c4812 (04:14:05), 24 minutes later. The
      assessment pins no baseline, so the alphabet cannot say whether the review ran against
      a pre-843d0049 tree (correct then, stale at commit) or a post-843d0049 tree
      (wrong when written). Either way the record is not re-verifiable.

  - id: GT-06
    name: Gate 3c - final risk-based validation
    subject_rule: "testing/RISK-COVERAGE-REPORT.md and all implemented code (T01)"
    baseline_rule: "committed HEAD"
    eligible_evidence: [ARCHITECTURE.md, SPECIFICATION.md, RISK-TEST-STRATEGY.md, ACCEPTANCE-MAP.md, RISK-COVERAGE-REPORT.md, integration suite results]
    missingness_policy: missing-history
    independence_predicate: "assessor is vnc-045-gate-3c, a uni-validator spawn distinct from the tester (T01)"
    procedure: judgment
    bar: "Risk mitigation proven by results; mandatory integration-test validation block."
    allowed_outcomes: [PASS, REWORKABLE FAIL, SCOPE FAIL]
    outcome_consequences:
      PASS: "phase-end test->pr-review; proceed to Phase 4"
      REWORKABLE FAIL: "loop back, max 2 iterations"
      SCOPE FAIL: "stop"
    required_record_category: gate-assessment
    definition_custodian_ref: AC-01
    requires_assessor: RO-09
    bound_by: WF-02
    evaluates: [UN-05]
    observed_outcomes:
      - iteration: 0
        outcome: CLAIMED-PASS
        assessment_record: ABSENT
        gate_outcome_record: ABSENT
    provenance: forge + repo-artifact
    critical_finding: >
      product/features/vnc-045/reports/gate-3c-report.md DOES NOT EXIST at 37c7b09a, and no
      vnc-045-gate-3c agent report exists. of the 226 feature directories at that commit, 154 carry
      reports/gate-3a-report.md, 157 carry gate-3b-report.md and 153 carry gate-3c-report.md,
      and vnc-045 is the ONLY feature carrying 3a and 3b but not 3c. The artefact is the
      established norm and its absence is an observation, not an inference. The claim "Gate 3c PASS" appears in the
      PR #929 body ("Gate 3a PASS - Gate 3b PASS - Gate 3c PASS") and the security review's
      merge-readiness line. The only Stage-3c record is RC-14, authored by AC-10 - the same
      actor that wrote and ran the tests. Under M01 the required assessment Event cannot be
      written (no independent assessor_refs, no independence_check), so no conforming
      gate_outcome Event exists for GT-06, and I8 ("missing evidence is explicit and never
      inferred as success") is exactly what the merged record violates.
      W2 does NOT claim the gate did not run - only that the alphabet does not evidence it.

  - id: GT-07
    name: Security review (PR)
    subject_rule: "the full main...HEAD diff of PR #929"
    baseline_rule: "PR head 08a45c53 vs base 9927de02"
    eligible_evidence: [source diff, ARCHITECTURE.md, RISK-TEST-STRATEGY.md, cargo audit]
    missingness_policy: missing-history
    independence_predicate: "fresh-context security reviewer (T01)"
    procedure: judgment
    bar: "Risk level + blocking findings; merge readiness READY | BLOCKED."
    allowed_outcomes: [READY, BLOCKED]
    outcome_consequences: {READY: "human merge gate opens", BLOCKED: "blocking items returned to human"}
    required_record_category: gate-assessment
    definition_custodian_ref: AC-01
    requires_assessor: RO-10
    bound_by: WF-02
    evaluates: [UN-02]
    observed_outcomes:
      - {iteration: 0, outcome: READY, risk_level: low, blocking: 0, record: RC-10}
    provenance: forge + repo-artifact
    forge_state_note: >
      The GitHub review object (id 4641592318) has state COMMENTED, not APPROVED, and there
      were zero inline review comments (unimatrix-pr-929-review-comments.json is literally
      the two bytes `[]`). The forge therefore records no approval; the READY outcome exists
      only as prose inside the comment body and RC-10.

  - id: GT-08
    name: Vision alignment check
    subject_rule: "ARCHITECTURE, SPECIFICATION, RISK-TEST-STRATEGY, SCOPE"
    baseline_rule: "the reduced source documents, 2026-07-07"
    eligible_evidence: ["product/PRODUCT-VISION.md", "goals #5517/#5518/#5474", "prior guardian patterns"]
