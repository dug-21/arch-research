capabilities:
  - id: CP-01
    name: KI-AUDIT
    external_ref: Unimatrix entry #5546
    observable_behavior: Every mutation writes an attributed audit row; audit_log is append-only.
    scope_ref: SC-02
    classification_refs: [functional, threshold]
    done_when: >
      (a) DELETE/UPDATE on audit_log fail (append-only, DDL trigger);
      (b) each mutation writes an attributed row.
    grade: proven
    grade_provenance: doc-claim
    grade_note: >
      "threshold (proven)" is asserted by AC-02 (uni-zero) in S01 comment 4898695344 and
      restated in 4899256125. NOT demonstrated to this run: the Unimatrix node and its
      proven_by set are outside the alphabet. Under M01 I9 this instance therefore records
      a CLAIMED grade of proven, not a demonstrated one.
    evidence_record_refs: missing-history
    required_by: [GO-01]
    advances: []
    composed_of: []
    prerequisite_of: []
    delivered_by: []          # deliberate: see UN-02.delivers
    enabled_by: [TE-01]
    provenance: doc-claim

  - id: CP-02
    name: SLN1 (poison resistance)
    external_ref: Unimatrix entry #5528
    observable_behavior: An abuse scenario provably cannot move the learned signal past a bound.
    scope_ref: SC-02
    classification_refs: [nonfunctional, curve]
    done_when: missing-history
    grade: UNREPRESENTABLE
    grade_observed_value: asserted
    grade_provenance: doc-claim
    grade_note: >
      The observed program's grade vocabulary is {proven, partial, missing, asserted}
      (S03 SCOPE-RISK-ASSESSMENT SR-10, quoting uni-capability SKILL.md) and the program
      explicitly ruled that "claimed" is a SLIP and "asserted" is authoritative
      (S01 comment 4898695344, OQ-1). M01 values.evidence_grade is RESOLVED and closed at
      [missing, claimed, partial, proven] with no registry and no extension_owner.
      The observed value therefore has no conforming home. Recording it as "claimed" would
      be silent normalisation of the exact term the program rejected. See findings F-01.
    evidence_record_refs: missing-history
    required_by: [GO-01]
    advances: []
    enabled_by: []
    provenance: doc-claim

