        baseline_ref: "git-tree:e20f8102c5132d8f1c27c49c787487e7d84b42ac (commit 9158a11 / formerly 17ebf2e)"
      relations: {follows: [WF-RESEARCH-SCOPE], depends_on: [], attempts: [], assigned_through: [], gated_by: [], consumes: [], produces: [], delivers: [], directed_by: [], replaces: []}
      note: >
        Identical V5 shape to UN-W1. Only the referent of baseline_ref changes: the tree oid is
        invariant under the rebase that REISSUED the commit id, and both ids are retained. Note the
        historical UN-W1 value is already correct and on main — this counterfactual buys durability
        against a future rewrite, not a repair of a present break.

  Attempt:
    - id: CF03-AT-RUN-1
      construct: Attempt
      provenance_class: counterfactual
      candidate: CF-03
      varies: AT-RUN-1
      fields:
        baseline_ref: "git-tree:140131bdf67e2ef2ab089f3f79467ba9c2bf11f3"
        started_at: "2026-08-28T11:45:42Z"
