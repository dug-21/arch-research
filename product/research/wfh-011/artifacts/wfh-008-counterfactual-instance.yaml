        disposition: hold
        resume_requirements:
          baseline: "git-tree:e20f8102c5132d8f1c27c49c787487e7d84b42ac"
          preconditions: ["scope boundary unchanged", "owner amendment binding", "target pin re-verified unmoved"]
          unresolved_residue: ["coverage gate open, one rework allowance remaining", "the 38-vs-37 manifest count conflict", "phase boundaries for scope and the first tech-discovery pass permanently lost"]
          next_admissible_transition: "independent round-2 coverage re-audit"
          recorded_by: "AC-COORD at 2026-08-28T13:28:56Z, after termination — NOT the interrupted actor's own disposition"
      relations: {unit: [UN-RUN], actors: [AC-LEAD-1], governed_by: [DL-RUN-1], produces: []}
      note: >
        THE EVOLVED FORM STILL CARRIES `_approx` ON disposition. `hold` remains a reconstruction
