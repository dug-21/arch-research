        make the residue visible, not to show the model passing.
      _approx: {disposition: PR-ATTEMPT-DISPOSITION}

  Event:
    - id: CF02-EV-DETECT
      construct: Event
      provenance_class: counterfactual
      candidate: CF-02
      varies: EV-031
      fields:
        event_type: observation
        occurred_at: "2026-08-27T19:36:00Z"
        recorded_at: "2026-08-27T19:36:00Z"
        scope_ref: SC-COL
        actor_refs: [AC-GIT]
        subject_refs: [RC-METHOD-SKILLS]
        significance: surprise
        carrier: artifact-ref
        custody: "checked-in manifest in the same repository — detectable, NOT custodial; the manifest is editable by the governed party"
        epistemic_kind: mechanical-observation
        extension:
          instrument: "sha256 manifest comparison over .claude/workflow, .claude/agents/factory, .claude/rules"
          subject: "twelve .claude/skills/uni-*/SKILL.md files"
          capture_custody: "repository working tree; the comparison output is retained"
          raw_evidence_ref: "the manifest diff"
      relations: {documented_by: [], caused_by: [], correlated_with: [], supersedes: []}
      note: >
        What CF-02 would have produced. It is an `observation`, not an authority refusal: nothing
        was prevented, and I18 remains unsatisfied in the evolved form as in the historical one.

    - id: CF04-EV-OBS
      construct: Event
      provenance_class: counterfactual
      candidate: CF-04
      varies: EV-015
      fields:
        event_type: observation
        occurred_at: "2026-08-28T12:50:22Z"
        recorded_at: "2026-08-28T12:50:22Z"
        scope_ref: SC-TEAM
        actor_refs: [AC-AUD-R1]
        subject_refs: [RC-W1]
        significance: routine
        carrier: artifact-ref
        custody: "transcript file committed beside the audit; authored by the auditing actor"
        epistemic_kind: reported-observation
        extension:
          instrument: "git ls-files '*package.json' | wc -l, and the any-depth find equivalent, at the pinned target commit"
