      relations:
        unit: SYN-UN-1
        actors: [SYN-AC-AGENT, SYN-AC-REVIEWER]
        governed_by: [SYN-DL-DYN]
        produces: [SYN-RC-1]
    - id: SYN-AT-2
      fields:
        baseline_ref: "SYN-WF-A@1"
        started_at: "2026-08-12T09:00:00Z"
        disposition: continue
      relations:
