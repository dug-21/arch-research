# wfh-011 W3 — CONFORMING SYNTHETIC BASELINE for the pinned Organizational Data Model V5
#
# PROVENANCE WARNING — READ BEFORE USE.
# Every element here is CONSTRUCTED FROM M01 (organizational-data-model-v5.yaml,
# sha256 bf8e55364e36f15ddaf5241cfbb1339ac9672fd04746c14a96306d6fa9841060).
# NOTHING in this file is observed history. It is NOT wfh-008 and NOT vnc-045.
# It is the minimal conforming witness set W3 needs so that each invalid fixture can be a
# ONE-MUTATION delta from a conforming instance. W1 and W2 own the historical instances;
# this file must never be counted as case coverage for either.
#
# All ids are prefixed SYN- for exactly that reason.

instance_meta:
  id: SYN-BASELINE-1
  provenance: constructed-from-M01
  observed_history: false
  model_sha256: bf8e55364e36f15ddaf5241cfbb1339ac9672fd04746c14a96306d6fa9841060
  purpose: >
    Conforming witness for the field/type/cardinality, inverse, registry, catalog, value,
    invariant, extension-ownership, custody and exclusion rules that a fixture then mutates.

# ---------------------------------------------------------------------------
# Extension by registration — the three registries M01 seeds EMPTY must be populated by a
# program before any conforming Record, Unit or Delegation can exist at all.
# ---------------------------------------------------------------------------
registered:
  record_category:
    finding:
      definition: an authored research finding with cited sources
      schema_extension: {version: "1", fields: [cites, workstream]}
      admission_rule: admitted only by an assessment Event under the run's coverage Gate
      retrieval: by scope and run topic
      lifecycle: draft -> active -> superseded
      correction: superseding Record, never in-place edit
      status: OPEN
    gate-report:
      definition: an independent coverage/gate assessment report
      schema_extension: {version: "1", fields: [ruling, rounds]}
      admission_rule: admitted on issue by the assessor named in the Gate
      retrieval: by gated subject
      lifecycle: issued -> superseded
      correction: superseding Record
      status: OPEN
  unit_kind:
    investigation:
      definition: a bounded question partition worked to a findings artifact
      workflow_ref: SYN-WF-A
      required_fields: [intended_outcome]
      status: OPEN
    change:
      definition: a bounded change to a repository artifact
      workflow_ref: SYN-WF-A
      required_fields: [intended_outcome]
      status: OPEN
  effect_class:
    repository-write:
      definition: a write to a version-controlled repository performed by an external forge
      target_schema: {repo: text, ref: text}
      receipt_requirements: {commit_sha: required, forge_response: required}
      status: OPEN

instances:
  Scope:
    - id: SYN-SC-COLL
      identity: SYN-SC-COLL
      fields:
        scope_type: collective
        name: Synthetic Collective
        objective: exercise the V5 authority root
        authority_root_ref: SYN-AC-OWNER
        effective_at: "2026-01-01T00:00:00Z"
      relations:
        contains: [SYN-SC-PROG]
    - id: SYN-SC-PROG
      identity: SYN-SC-PROG
      fields:
        scope_type: program
        name: Synthetic Program
        objective: exercise the V5 program plane
        authority_root_ref: SYN-AC-OWNER
        effective_at: "2026-01-01T00:00:00Z"
      relations:
        parent: SYN-SC-COLL

  Actor:
    - id: SYN-AC-OWNER
      fields: {name: Owner, actor_type: human, declared_identity: "owner@synthetic",
               lifecycle_state: active}
    - id: SYN-AC-CUSTODIAN
      fields: {name: Method Custodian, actor_type: human,
               declared_identity: "custodian@synthetic", lifecycle_state: active}
    - id: SYN-AC-AGENT
      fields: {name: Executing Agent, actor_type: agent,
               declared_identity: "agent@synthetic", lifecycle_state: active}
      relations:
        has_skill: [{ref: SYN-SK-1, evidence_refs: [SYN-RC-1], grade: partial,
                     currentness: current, expires_at: "2027-01-01T00:00:00Z"}]
        receives: [SYN-DL-DYN]
    - id: SYN-AC-REVIEWER
      # participates in SYN-AT-1 but receives no Delegation: the T-06 traversal hole witness
      fields: {name: Human Reviewer, actor_type: human,
               declared_identity: "reviewer@synthetic", lifecycle_state: active}
    - id: SYN-AC-LEAD
      fields: {name: Lead Agent, actor_type: agent, declared_identity: "lead@synthetic",
               lifecycle_state: active}
      relations:
        has_skill: [{ref: SYN-SK-1, evidence_refs: [SYN-RC-1], grade: claimed,
                     currentness: current}]
        holds_role: [{ref: SYN-RL-EXEC, scope_ref: SYN-SC-PROG,
                      effective_at: "2026-01-01T00:00:00Z"}]
    - id: SYN-AC-INSTRUMENT
      fields: {name: Repository Reader, actor_type: deterministic-component,
               declared_identity: "git-log-reader", lifecycle_state: active}

  Skill:
    - id: SYN-SK-1
      identity: SYN-SK-1
      fields:
        name: adversarial model analysis
        work_class: rejection-suite construction
        definition_record_ref: SYN-RC-1
        required_tool_classes: [deterministic-parser]
        local_binding: {repo: arch-research}
      relations:
        required_by: [SYN-RL-EXEC, SYN-WF-A]
        held_by: [{ref: SYN-AC-AGENT, evidence_refs: [SYN-RC-1], grade: partial,
                   currentness: current, expires_at: "2027-01-01T00:00:00Z"},
                  {ref: SYN-AC-LEAD, evidence_refs: [SYN-RC-1], grade: claimed,
                   currentness: current}]

  Role:
    - id: SYN-RL-EXEC
      identity: SYN-RL-EXEC
      fields:
        name: executor
        responsibility: perform assigned Units within a standing grant
      relations:
        requires: [SYN-SK-1]
        assigned_to: [SYN-AC-LEAD]
        receives: [SYN-DL-STANDING]
    - id: SYN-RL-ASSESSOR
      identity: SYN-RL-ASSESSOR
      fields:
        name: independent assessor
        responsibility: assess a pinned subject against a Gate bar
        independence_constraints: ["must not have authored the subject"]

  Technology:
    - id: SYN-TE-1
      identity: SYN-TE-1
      fields:
        name: deterministic instance checker
        grade: partial
        constraints: read-only; no runtime enforcement point
        evidence_record_refs: [SYN-RC-1]
      relations:
        enables: [SYN-CP-1]

  Goal:
    - id: SYN-GO-1
      identity: SYN-GO-1
      fields:
        statement: the organization can discriminate conforming from non-conforming work records
        scope_ref: SYN-SC-PROG
        success_criteria: every applicable rule has a witness and a counterexample
        claim_floor: [SYN-CP-1]
        north_star: [SYN-CP-2]
        lifecycle_state: active
      relations:
        requires: [SYN-CP-1, SYN-CP-2]
        is_advanced_by: [SYN-CP-1]
        directs: [SYN-UN-1]
    - id: SYN-GO-2
      identity: SYN-GO-2
      fields:
        statement: the organization can change a repository artifact under an authorized grant
        scope_ref: SYN-SC-PROG
        success_criteria: an effect receipt exists for every consequential write
        claim_floor: [SYN-CP-2]
        lifecycle_state: active
      relations:
        requires: [SYN-CP-2]
        directs: [SYN-UN-2]

  Capability:
    - id: SYN-CP-1
      identity: SYN-CP-1
      fields:
        name: rule discrimination
        observable_behavior: a non-conforming instance is refused with the violated rule named
        scope_ref: SYN-SC-PROG
        classification_refs: [functional, threshold]
        done_when: every applicable declared rule rejects at least one minimal counterexample
        grade: partial
        evidence_record_refs: [SYN-RC-1]
      relations:
        required_by: [SYN-GO-1]
        advances: [SYN-GO-1]
        composed_of: [SYN-CP-2]
        delivered_by: [SYN-UN-1]
        enabled_by: [SYN-TE-1]
    - id: SYN-CP-2
      identity: SYN-CP-2
      fields:
        name: authorized repository write
        observable_behavior: a write reaches the repository only with a matching effect receipt
        scope_ref: SYN-SC-PROG
        classification_refs: [functional]
        done_when: a receipt names the commit and the granting Delegation
        grade: claimed
      relations:
        required_by: [SYN-GO-1, SYN-GO-2]
        delivered_by: [SYN-UN-2]

  Workflow:
    - id: SYN-WF-A
      identity: SYN-WF-A
      fields:
        name: bounded investigation workflow
        method_statement: scope, partition, instantiate, adjudicate, audit
        owner_scope_ref: SYN-SC-PROG
        unit_kinds: [investigation, change]
        dependency_rules: [{rule: "a change Unit depends on its investigation Unit"}]
        state_vocabulary: [scoped, in-progress, gated, closed]
        definition_custodian_ref: SYN-AC-CUSTODIAN
      relations:
        applies_to: [SYN-GO-1]
        requires: [SYN-SK-1]
        binds: [SYN-GT-1]
        governs: [SYN-UN-1, SYN-UN-2]
    - id: SYN-WF-B
      # applies_to SYN-GO-1 but governs no Unit: the T-02 incompleteness witness
      identity: SYN-WF-B
      fields:
        name: alternate investigation workflow
        method_statement: a second methodology declared applicable but not yet exercised
        owner_scope_ref: SYN-SC-PROG
        unit_kinds: [investigation]
        dependency_rules: []
        state_vocabulary: [scoped, closed]
        definition_custodian_ref: SYN-AC-CUSTODIAN
      relations:
        applies_to: [SYN-GO-1]

  Gate:
    - id: SYN-GT-1
      identity: SYN-GT-1
      fields:
        subject_rule: the Unit named by the assessment, at its pinned baseline
        baseline_rule: the baseline_ref recorded on the Attempt under assessment
        eligible_evidence: [{kind: record, category: finding},
                            {kind: record, category: gate-report}]
        missingness_policy: missing evidence is declared and never inferred as success
        independence_predicate: the assessor authored none of the subject
        procedure: judgment
        bar: every applicable rule has a witness or an explicit disposition
        allowed_outcomes: [pass, reworkable, scope-fail]
        outcome_consequences: {pass: proceed, reworkable: two rounds, scope-fail: stop}
        required_record_category: gate-report
        definition_custodian_ref: SYN-AC-CUSTODIAN
      relations:
        requires_assessor: SYN-RL-ASSESSOR
        bound_by: SYN-WF-A
        # SYN-RC-1 is a NON-Unit target: the declared inverse must NOT be required for it
        evaluates: [SYN-UN-1, SYN-RC-1]

  Delegation:
    - id: SYN-DL-STANDING
      identity: SYN-DL-STANDING
      fields:
        autonomy_tier: A2
        effect_grants: [repository-write]
        resource_ceiling: {external_cost: 0, compute: none}
        escalation_conditions: [material spend, premise change]
        effective_at: "2026-01-01T00:00:00Z"
        definition_custodian_ref: SYN-AC-CUSTODIAN
      relations:
        grantor: SYN-AC-OWNER
        grantee: SYN-RL-EXEC
        scope: SYN-SC-PROG
        governs: [SYN-AT-2]
        enforced_by: [SYN-EB-FORGE]
    - id: SYN-DL-DYN
      identity: SYN-DL-DYN
      fields:
        autonomy_tier: A1
        effect_grants: [repository-write]
        resource_ceiling: {external_cost: 0, compute: none}
        escalation_conditions: [premise change]
        effective_at: "2026-08-01T00:00:00Z"
        definition_custodian_ref: SYN-AC-CUSTODIAN
      relations:
        grantor: SYN-AC-OWNER
        grantee: SYN-AC-AGENT
        scope: SYN-SC-PROG
        unit: SYN-UN-1
        derived_from: SYN-DL-STANDING
        governs: [SYN-AT-1]
        enforced_by: [SYN-EB-FORGE]

  EffectBoundary:
    - id: SYN-EB-FORGE
      fields:
        name: external forge
        effect_classes: [repository-write]
        custody: credentials held outside the governed activity by the collective
        can_refuse: true
      relations:
        enforces: [SYN-DL-STANDING, SYN-DL-DYN]

  Unit:
    - id: SYN-UN-1
      identity: SYN-UN-1
      fields:
        unit_kind: investigation
        intended_outcome: a rejection suite covering every applicable declared rule
        scope_ref: SYN-SC-PROG
        current_state: gated
        baseline_ref: "SYN-WF-A@1"
      relations:
        directed_by: [SYN-GO-1]
        follows: SYN-WF-A
        attempts: [SYN-AT-1]
        assigned_through: [SYN-DL-DYN]
        gated_by: [SYN-GT-1]
        consumes: [SYN-RC-2]
        produces: [SYN-RC-1]
        delivers: [SYN-CP-1]
    - id: SYN-UN-2
      identity: SYN-UN-2
      fields:
        unit_kind: change
        intended_outcome: the checker artifact is committed to the repository
        scope_ref: SYN-SC-PROG
        current_state: in-progress
        baseline_ref: "SYN-WF-A@1"
      relations:
        directed_by: [SYN-GO-2]
        follows: SYN-WF-A
        attempts: [SYN-AT-2]
        depends_on: [SYN-UN-1]
        delivers: [SYN-CP-2]

  Attempt:
    - id: SYN-AT-1
      fields:
        baseline_ref: "SYN-WF-A@1"
        started_at: "2026-08-10T09:00:00Z"
        ended_at: "2026-08-10T17:00:00Z"
        disposition: complete
        resume_requirements: {baseline: "SYN-WF-A@1", preconditions: [], residue: [],
