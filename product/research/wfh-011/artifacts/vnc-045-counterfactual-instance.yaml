rejected_candidates:
  - id: CF-R01
    tempting_change: >
      Rename the program's capability grade value `asserted` to `claimed` so it lands inside
      M01 values.evidence_grade [missing, claimed, partial, proven].
    why_rejected: >
      CIRCULAR. The only reason to make this change is that V5's closed vocabulary prefers
      it. The program considered and explicitly rejected `claimed`: uni-zero's OQ-1 ruling
      (S01 comment 4898695344) is "`asserted` is authoritative ... `claimed` in #928 is a
      slip." A change whose sole justification is conformity to the model under test is
      prohibited by the anti-force-fitting amendment, and it would also erase an evidenced
      domain decision. The mismatch is therefore carried as a MODEL pressure row
      (F-01 / cause: model-defect), not as a project evolution.
  - id: CF-R02
    tempting_change: >
      Introduce credentialed per-agent identity so that Actor.declared_identity becomes an
      attestation and I12/I17 acquire an enforcement point.
    why_rejected: >
      RELITIGATES A SETTLED, HUMAN-LOCKED DECISION. ADR-008 records that the security posture
      is human-LOCKED and that in OSS "the enforceable controls are audit + rate + lifecycle,
      NOT identity, because there is no client token and no per-agent trust resolution
      locally"; the declarative-attribution bound is documented as an accepted risk in
      RISK-TEST-STRATEGY Residual Risk 1. Existing authority and custody semantics are
      CONSTRAINTS on a counterfactual, not friction to remove. The gap is therefore carried
      as an enforcement-gap row (F-05), not as a project evolution.

