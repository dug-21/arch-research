- id: CF-04
  title: Retain the raw test-runner output alongside the authored risk-coverage report
  source_link:
    historical_records: [RC-14]
    historical_events: [EV-26]
    x_rows: ["invariants.I4", "registries.event_type.seeded.observation", "values.epistemic_kind.values.mechanical-observation", "core.Record.fields.missing_or_unavailable_refs"]
  cause_classification: [project-evolution-candidate, historical-evidence-gap]
  classification_evidence: >
    RC-14 asserts 6961 unit tests passed / 0 failed, smoke 32/32, protocol 14, security 23,
    and per-risk PASS for R-01..R-08. None of that output survives anywhere in the alphabet,
    so under M01 I4 every one of those numbers is a reported-observation, not a
    mechanical-observation. The cost is demonstrated, not hypothetical: RC-14 states the tool
    guard moved "12 -> 15" and the PR body calls context_tag "the 13th tool", while the
    committed diff of test_protocol.py renames test_list_tools_returns_fourteen to _fifteen.
    Three authored numbers, one observable fact, and both authored records are wrong. Nobody
    caught it because there was nothing to check against.
  smallest_change: >
    The tester already redirects cargo output to a file (T01 mandates file-not-pipe with a hard
    ceiling, precisely so rc=$? captures cargo). Keep that file: commit the runner output, or
    its SHA-256 plus the first/last N lines, next to RISK-COVERAGE-REPORT.md, and cite it from
    the report's provenance line.
  independent_reason: >
    NOT V5. The project's own R-03 discipline for vnc-045 is that an audit record must be
    "sufficient to reconstruct what changed, when, and by whom" and must never be the "{}"
    sentinel - it treats a summary standing in for a record as a security defect for machine
    writes. The same standard applied to its own gate evidence would have caught a factual
    error that shipped in the merged tree. Independent of any model.
  semantic_proof_authority_custody_preservation: >
    PRESERVED and strengthened. Nothing is removed and no bar is lowered; an authored claim
    gains a capture artefact behind it. It does not by itself make the observation
    mechanical - the capture custody is still the same actor's shell - so the change is
    honest about what it buys: reproducibility and cross-checkability, not attestation.
  migration_cost: >
    Low-to-moderate. Repository size grows per feature (mitigable by storing a digest plus a
    truncated head/tail rather than full output); one tester step; one line in the
    RISK-COVERAGE-REPORT template. It does NOT retroactively supply the vnc-045 output.
  affected_artifacts:
    - ".claude/protocols/uni/uni-delivery-protocol.md (Stage 3c, Cargo Output Truncation section)"
    - "product/features/{id}/testing/ (new retained artefact)"
    - "product/features/{id}/testing/RISK-COVERAGE-REPORT.md (provenance line)"
  current_form_representable: true
  current_form_note: >
    YES, and correctly: EV-26 carries capture_custody: ABSENT and raw_evidence_ref: ABSENT,
    epistemic_kind reported-observation, and RC-14 lists the three unretained artefacts under
    missing_or_unavailable_refs. V5's I4 and the observation extension are what force the
    distinction to be visible instead of collapsing into "tests passed".
  evolved_form_representable: true
  evolved_form_note: >
    EV-26 would carry raw_evidence_ref and a capture_custody value; epistemic_kind would remain
    reported-observation unless the capture is custodied outside the reporting actor.
  post_evolution_fit: retain
  unresolved_discriminator: not-applicable
  cf_entities:
    - cf_event_id: CF-EV-26
      replaces: EV-26
      extension: {instrument: AC-17, subject: "cargo test --workspace ; pytest suites/", capture_custody: "repository blob, tester-produced", raw_evidence_ref: "product/features/vnc-045/testing/raw/*.log"}
      epistemic_kind: reported-observation
      provenance: counterfactual

