- id: CF-05
  title: Make the Gate 3c assessment record a precondition the merge cannot bypass
  source_link:
    historical_gates: [GT-06]
    historical_events: [EV-13, EV-14, EV-20, EV-21]
    historical_units: [UN-05]
    x_rows: ["invariants.I7", "invariants.I8", "supporting.Gate.fields.independence_predicate", "registries.event_type.seeded.assessment", "registries.event_type.seeded.gate_outcome"]
  cause_classification: [enforcement-gap, project-evolution-candidate, historical-evidence-gap]
  classification_evidence: >
    ENFORCEMENT-GAP: T01 defines Gate 3c as a mandatory validator-assessed gate writing
    reports/gate-3c-report.md, and nothing enforces it - the leader can state "Gate 3c PASS"
    in the PR body and the merge proceeds. HISTORICAL-EVIDENCE-GAP: the alphabet cannot
    determine whether the gate ran and went unrecorded or did not run. OBSERVATION:
    product/features/vnc-045/reports/gate-3c-report.md does not exist at 37c7b09a. Of the 226
    feature directories in the tree at that commit, 154 carry gate-3a-report.md, 157 carry
    gate-3b-report.md and 153 carry gate-3c-report.md - and vnc-045 is the ONLY feature that
    carries 3a and 3b but not 3c. Its absence is an observation against an established norm,
    not an inference. The only Stage-3c record is
    RC-14, authored by AC-10 - the actor that wrote and ran the tests under assessment.
  smallest_change: >
    Require the file. Either (a) a GitHub branch-protection required status check on the
    default branch that fails when product/features/{id}/reports/gate-3c-report.md is absent
    or does not name the feature's head commit, or (b) if forge configuration is out of reach,
    a pre-merge checklist item the human ticks against the file's presence. (a) is preferred
    because it puts the check outside every governed actor.
  independent_reason: >
    NOT V5, and not even novel to the project: the protocol already declares Gate 3c mandatory,
    already specifies its independent assessor, already prescribes its output path, and 153 of 226
    feature directories in the same repository produce it. The change makes an already-desired,
    already-documented, already-normal behaviour non-bypassable. The counter-evidence is that
    vnc-045 merged without it and nothing noticed for the life of the branch.
  semantic_proof_authority_custody_preservation: >
    PRESERVED, and authority moves in the SAFE direction. The check is a forge-side condition
    on an externally custodied boundary (EB-01) - away from the agents and away from the
    delivery leader, not toward them. It changes no gate bar, no outcome vocabulary, no
    consequence, and grants no new privilege. Critically, it does not manufacture a passing
    gate: an absent report blocks, it does not auto-pass. That is I7's fail-closed behaviour
    given an enforcement point for the first time.
    Risk to watch (recorded, not resolved): a required check whose predicate is "a file
    exists" is satisfiable by writing a file. It raises the cost of an unrecorded gate; it does
    not attest that the assessment happened. Claiming otherwise would be exactly the
    "overstating defensive structure" the project's own standing lesson warns against.
  migration_cost: >
    Moderate. Option (a) needs repository-admin configuration and a small check script, and it
    changes the merge path for every feature in the repository, not just vnc-045; any feature
    legitimately without a Stage 3c (a docs-only change) needs an explicit exemption path or
    the check becomes a nuisance that gets disabled. Option (b) is nearly free and
    correspondingly weaker. Both leave the 226 historical feature directories untouched.
  affected_artifacts:
    - "GitHub branch protection on dug-21/unimatrix:main (option a)"
    - "a CI check script (option a)"
    - ".claude/protocols/uni/uni-delivery-protocol.md (Gate 3c, Phase 4 human merge gate)"
    - "an exemption convention for features with no Stage 3c"
  current_form_representable: partial
  current_form_note: >
    The historical instance CANNOT write a conforming assessment or gate_outcome Event for
    GT-06 - EV-13/EV-14 are marked NOT-WRITABLE with the blocking reason - and that is V5
    behaving correctly. I8 ("missing evidence is explicit and never inferred as success") is
    precisely the rule the merged record breaks, and V5 surfaces it as a missing required
    Record rather than letting "Gate 3c PASS" pass as a fact.
  evolved_form_representable: true
  evolved_form_note: >
    EV-13/EV-14 become writable with an independent assessor_refs and a pinned
    subject_baseline; UN-05.current_state becomes gate-3c-PASS rather than
    claimed-PASS-without-gate-record.
  post_evolution_fit: retain
  unresolved_discriminator: >
    Whether the gate assessment actually occurred in vnc-045 and was simply not committed
    remains unresolvable from the fixed alphabet, and no project change can settle it
    retrospectively. The post-evolution fit therefore applies to future units only; the
    current-project verdict for GT-06 stands unchanged.
  cf_entities:
    - cf_event_id: CF-EV-13
      replaces: EV-13
      event_type: assessment
      scope_ref: SC-03
      actor_refs: ["<uni-validator gate-3c spawn>"]
      subject_refs: [UN-05]
      authority_ref: "<DL for the gate-3c assessor>"
      epistemic_kind: reviewed-finding
      extension: {gate_version_ref: "GT-06 @ <protocol digest>", subject_baseline: "bf7c4812", evidence_set: [RC-14, RC-06, "ACCEPTANCE-MAP"], assessor_refs: ["<gate-3c actor>"], independence_check: "assessor != RC-14 author"}
      provenance: counterfactual
    - cf_event_id: CF-EV-14
      replaces: EV-14
      event_type: gate_outcome
      extension: {assessment_ref: CF-EV-13, outcome: PASS, missingness: "R-03 audit completeness is unit-seam only, by design", consequence_disposition: "phase-end test->pr-review"}
      provenance: counterfactual
