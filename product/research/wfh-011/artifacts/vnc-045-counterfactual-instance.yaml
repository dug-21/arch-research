- id: CF-02
  title: Pin the reviewed commit in every gate assessment record
  source_link:
    historical_records: [RC-08, RC-09]
    historical_events: [EV-07, EV-09, EV-11]
    x_rows: ["supporting.Gate.fields.baseline_rule", "registries.event_type.seeded.assessment (subject_baseline)", "supporting.Attempt.fields.baseline_ref"]
  cause_classification: [project-evolution-candidate]
  classification_evidence: >
    RC-09 (gate-3b report) lists as an open WARN a stale `#[allow(dead_code)]` on
    ServiceLayer.store_tag and recommends removing it. Commit 843d0049 (03:50:17) had already
    removed exactly that attribute; RC-09 was committed at bf7c4812 (04:14:05). RC-09 pins no
    commit, so the alphabet cannot determine whether the review ran before or after 843d0049,
    and the finding cannot be re-verified. Separately, GT-04 ran two iterations whose failing
    and passing artefacts both collapse into commit 3afc2c49, so AT-03's baseline_ref does not
    survive at all.
  smallest_change: >
    One line in the gate-report template - `reviewed_commit: <sha>` - written by the validator
    from `git rev-parse HEAD` at the moment it reads the tree. Nothing else.
  independent_reason: >
    NOT V5. T01 already states the rule this change would make checkable: "Gates check
    committed HEAD - working tree changes are invisible to them," and instructs the leader to
    commit modified production files before spawning the validator. The protocol already
    treats the reviewed baseline as load-bearing; it simply does not record which one it was.
    A code review that cannot name what it reviewed cannot be re-run, and the case supplies a
    concrete instance of that failing.
  semantic_proof_authority_custody_preservation: >
    PRESERVED. Purely additive provenance. The gate's bar, outcomes, consequences, assessor
    and independence predicate are untouched; nothing is relaxed and no authority moves.
  migration_cost: >
    Low. One template line and one command per gate. It does NOT retroactively recover AT-03's
    lost baseline - design-session artefacts are untracked until Session 2 commits them (T02),
    so a rework iteration that happens before the first commit still leaves no reviewable
    baseline. Closing that would require committing design artefacts during Session 1, a
    larger change with its own trade-offs, and is NOT proposed here.
  affected_artifacts:
    - ".claude/protocols/uni/uni-delivery-protocol.md (Gate 3a/3b/3c spawn templates)"
    - "product/features/{id}/reports/gate-*-report.md (template header)"
  current_form_representable: partial
  current_form_note: >
    Gate.baseline_rule is expressible ("committed HEAD"), but the assessment Event's
    required subject_baseline is missing-history on EV-07/EV-09/EV-11, and Attempt.baseline_ref
    (REQUIRED) is missing-history on AT-03. V5 exposes the hole; it does not create it.
  evolved_form_representable: true
  post_evolution_fit: retain
  unresolved_discriminator: not-applicable
  cf_entities:
    - cf_event_id: CF-EV-11
      replaces: EV-11
      extension: {gate_version_ref: "GT-05 @ <protocol digest>", subject_baseline: "843d0049", evidence_set: [RC-04, RC-05, RC-06], assessor_refs: [AC-12], independence_check: "declared"}
      provenance: counterfactual

