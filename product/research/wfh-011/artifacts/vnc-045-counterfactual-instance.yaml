- id: CF-03
  title: Record a scope-reduction decision on the tracking issue at the moment it is made
  source_link:
    historical_events: [EV-05, EV-06]
    historical_units: [UN-01, UN-02]
    x_rows: ["registries.event_type.seeded.decision", "core.Event.fields.occurred_at", "core.Event.fields.authority_ref", "core.Event.fields.custody"]
  cause_classification: [project-evolution-candidate, historical-evidence-gap]
  classification_evidence: >
    EV-05 - the decision that voided the feature's only Critical risk, moved six of ten scope
    risks out of test obligation, deprecated four ADRs and changed the deliverable - exists in
    the alphabet only as the dated phrase "scope reduced by human 2026-07-07", repeated inside
    seven documents written by the actors the decision governed. There is no issue comment, no
    commit, no forge object. Its required occurred_at cannot be given at the declared timestamp
    type; only a two-hour window (after EV-03 at 01:33:14Z, before commit afaa8385 at 02:50:37Z)
    is inferable, and that window is an inference, not an observation. The historical-evidence-gap
    classification is retained because no project change can recover what was not recorded.
  smallest_change: >
    When the human makes a scope decision at either of the two protocol human gates, post one
    comment on the tracking issue stating the decision, its rationale and its time, before the
    synthesizer regenerates anything. One comment. No new artefact type.
  independent_reason: >
    NOT V5, and the case argues it against itself. vnc-045's own thesis (ADR-009, SD-7) is that
    the append-only audit record is "the PRIMARY control" and that accountability, not
    prevention, is the security model - for a single tag mutation, recorded to the millisecond
    with prior and new value. The same organisation left its own most consequential decision
    with no record at all. The asymmetry is the argument: the project already believes what
    this change asks for, and applies it only to machine writes.
  semantic_proof_authority_custody_preservation: >
    PRESERVED, and custody strictly improves. The decision stays with AC-01; the record moves
    from actor-authored paraphrase to forge-custodied primary source with an attested author
    and timestamp. No authority moves toward the governed activity - the opposite: the
    governed agents stop being the sole narrators of the decision that governs them.
  migration_cost: >
    Very low - one comment per scope decision. Affected surfaces are two protocol human-gate
    sections. It does NOT retroactively supply EV-05: history stays absent.
  affected_artifacts:
    - ".claude/protocols/uni/uni-design-protocol.md (Phase 1 human approval; Phase 2d handling human-requested changes)"
    - ".claude/protocols/uni/uni-delivery-protocol.md (human merge gate)"
  current_form_representable: partial
  current_form_note: >
    The decision Event is writable in V5 with the correct authority_ref (SC-03, via the M02 R4
    correction to ref<Delegation|Scope>) and the correct disposition, but occurred_at, recorded_at
    and custody are missing-history and are recorded as such. V5 makes the hole visible and
    typed; it does not fill it.
  evolved_form_representable: true
  post_evolution_fit: retain
  unresolved_discriminator: not-applicable
  cf_entities:
    - cf_event_id: CF-EV-05
      replaces: EV-05
      event_type: decision
      occurred_at: "<forge comment created_at>"
      recorded_at: "<forge comment created_at>"
      scope_ref: SC-03
      actor_refs: [AC-01]
      authority_ref: SC-03
      epistemic_kind: mechanical-observation
      significance: surprise
