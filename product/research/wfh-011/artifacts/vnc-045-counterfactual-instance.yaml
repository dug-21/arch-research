- id: CF-01
  title: Stamp every agent and gate report with the scope revision it was written against
  source_link:
    historical_records: [RC-13, RC-20, RC-21, RC-23, RC-15]
    historical_events: [EV-06]
    x_rows: ["core.Record.fields.currentness", "core.Record.relations.supersedes", "core.Record.fields.lifecycle_state"]
  cause_classification: [project-evolution-candidate]
  classification_evidence: >
    RC-20 (architect report), RC-21 (spec report) and RC-13 (vision-guardian report) describe
    UN-01 - the pre-reduction feature with an active protected_tags policy, ADR-003/005/006/007
    live, AC-01..AC-09 and a shipped min_trust_level - and are committed unchanged, in commit
    afaa8385, alongside the reduced SCOPE/ARCHITECTURE/SPECIFICATION that contradict them.
    Nothing in any file distinguishes them from the current ones.
  smallest_change: >
    Add two header lines to the agent-report and gate-report templates:
    `scope_revision:` (the SCOPE.md content digest the report was written against) and
    `superseded_by:` (empty at write time). When the synthesizer regenerates derived artefacts
    after a human scope change - the step T02 already mandates - it also stamps `superseded_by`
    on any report whose `scope_revision` no longer matches.
  independent_reason: >
    NOT V5. The harm is demonstrated inside the case by the project's own actors: the
    vision-guardian's ALIGNMENT-REPORT (RC-03) records that Unimatrix pattern #5607 "cites a
    now-stale clean instance (vnc-045 min_trust_level R-10/AC-09b)" and hands the retro a
    manual reconciliation task - a task created purely because a superseded report was
    indistinguishable from a current one. The project already pays this cost by hand.
  semantic_proof_authority_custody_preservation: >
    PRESERVED. Additive metadata only. No proof bar changes; no gate outcome changes; no
    authority moves - the stamp is written by the synthesizer under the same human decision
    that triggered the regeneration, and the custodian of the scope revision remains AC-01.
    Nothing is deleted: the superseded report stays on disk with its reasoning intact,
    which is the same treatment ADR-003/005/006/007 already receive (RC-22 shows the project
    ALREADY does this for ADRs and only for ADRs).
  migration_cost: >
    Low. Two template lines; one synthesizer step; no code, no schema, no forge configuration.
    Historical reports are not retro-stamped (that would manufacture history) - the stamp is
    absent on pre-change reports and its absence is itself informative.
  affected_artifacts:
    - ".claude/protocols/uni/uni-design-protocol.md (Phase 2c synthesizer step)"
    - ".claude/protocols/uni/uni-delivery-protocol.md (agent report conventions)"
    - "product/features/{id}/agents/*.md (template header)"
    - "product/features/{id}/reports/gate-*-report.md (template header)"
  current_form_representable: true
  current_form_note: >
    YES - and this is a V5 win, not a V5 need. core.Record.fields.currentness
    [current|superseded|stale|unknown] and core.Record.relations.supersedes already express
    the observed mess exactly; RC-13/RC-20/RC-21/RC-23 carry currentness: superseded in the
    historical instance with cited evidence.
  evolved_form_representable: true
  evolved_form_note: >
    YES - RC-03 would carry supersedes: [RC-13] as a project-written fact rather than a W2
    reconstruction, and Record.provenance_refs would carry the scope digest.
  post_evolution_fit: retain
  unresolved_discriminator: not-applicable
  cf_entities:
    - cf_record_id: CF-RC-13
      replaces: RC-13
      currentness: superseded
      supersedes: []
      superseded_by: RC-03
      provenance: counterfactual
