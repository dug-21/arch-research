  Workflow:
  - id: WF-RESEARCH-SCOPE
    construct: Workflow
    version: 1
    fields:
      name: research-scope
      method_statement: 'The proving-grounds run: research ONE capability to a graded technology landscape (directional/empirical) or prove a technology (validated). Phases scope -> tech-discovery -> [feasibility] -> synthesis. INIT opens three surfaces first: Issue, cycle, git.'
      owner_scope_ref: SC-COL
      unit_kinds:
      - research-scope-run
      - scope-definition
      - research-workstream
      - coverage-audit
      - pre-distillation-correction
      - synthesis
      - relevance-review
      - run-close
      dependency_rules:
      - scope-definition precedes every research-workstream
      - every research-workstream precedes coverage-audit
      - coverage-audit PASS precedes synthesis
      - synthesis precedes relevance-review
      - relevance-review and the human synthesis gate precede run-close
      - feasibility is SKIPPED for directional runs
      - REWORK is bounded at two rounds; the third is SCOPE-FAIL
      state_vocabulary:
      - scoped
      - researching
      - done
      - scope
      - tech-discovery
      - feasibility
      - synthesis
      - closed
      definition_custodian_ref: AC-OWNER
    relations:
      applies_to:
      - GO-WFH
      - GO-JURATI-SUBSTRATE
      requires:
      - SK-READ-ONLY-RESEARCH
      - SK-RUN-ORCHESTRATION
      binds:
      - GT-SCOPE
      - GT-COVERAGE
      - GT-SYNTHESIS
      - GT-FIREWALL
      governs:
      - UN-RUN
      - UN-SCOPE
      - UN-W1
      - UN-W2
      - UN-W3
      - UN-W4
      - UN-W5
      - UN-W6
      - UN-W7
      - UN-AUDIT-R1
      - UN-AUDIT-R2
      - UN-CORRECTIONS
      - UN-SYNTH
      - UN-RELEVANCE
      - UN-CLOSE
    provenance:
    - T01
    - R01
    - R05
    custody: .claude/workflow/research-scope.md, sha256 bd3fa02b761497303e4c72f3edd3c1e98b6eb31427fd9f10b12633c8d6cd5648 — inside the same repository the governed agents write to; no CODEOWNERS file exists
    evidence_note: 'definition_custodian_ref is set to AC-OWNER on repository-ownership grounds only. The file''s most recent revision (9d7806a, 2026-08-27) was authored by the agent identity ''Claude Opus 4.8'', i.e. by the same actor class the definition governs. See PR-METHOD-CUSTODY.

