  Gate:
  - id: GT-SCOPE
    construct: Gate
    version: 1
    fields:
      subject_rule: the run's SCOPE.md at the commit named in the gate request
      baseline_rule: the scope commit id posted in the Issue gate-request comment
      eligible_evidence:
      - the SCOPE.md content
      - the leader's INIT surface report
      missingness_policy: no discovery may begin before an explicit approval; silence is not approval
      independence_predicate: the approver is the human owner and did not author the scope
      procedure: judgment
      bar: the directional boundary, workstream partition, evidence-label discipline and coverage rule are acceptable
      allowed_outcomes:
      - approved
      - approved-with-amendment
      - rejected
      outcome_consequences:
        approved: advance scope -> tech-discovery
        approved-with-amendment: amend SCOPE.md by adaptation, then advance
        rejected: state required scope changes; do not begin discovery
      required_record_category: governance-decision-log
      definition_custodian_ref: AC-OWNER
    relations:
      requires_assessor:
      - RO-OWNER
      bound_by:
      - WF-RESEARCH-SCOPE
      evaluates:
      - UN-SCOPE
    provenance:
    - T01
    - R05
  - id: GT-COVERAGE
    construct: Gate
    version: 1
    fields:
      subject_rule: the run's findings set at the pinned rework commit, against the SCOPE's numbered coverage predicates
      baseline_rule: the commit id of the findings under audit; each round re-pins
      eligible_evidence:
      - the findings records
      - the auditor's own independent residue sweeps
      - deterministic repository enumeration at the pinned target commit
      missingness_policy: unresolved dynamic or provenance questions remain visible as gaps; they never become inferred closures; absence is never filled
      independence_predicate: the assessor authored none of the audited findings and none of the prior round's coverage audit
      procedure: judgment
      bar: all six SCOPE coverage predicates discharged, and both residue sweeps dry against an assessor-run instrument
      allowed_outcomes:
      - PASS
      - REWORKABLE
      - SCOPE-FAIL
      outcome_consequences:
        PASS: tech-discovery closes; synthesis may begin
        REWORKABLE: one bounded rework round; at most two rounds exist
        SCOPE-FAIL: the run stops; the boundary is re-scoped
      required_record_category: coverage-audit
      definition_custodian_ref: AC-OWNER
    relations:
      requires_assessor:
      - RO-COVERAGE-AUDITOR
      bound_by:
      - WF-RESEARCH-SCOPE
      evaluates:
      - UN-W1
      - UN-W2
      - UN-W3
      - UN-W4
      - UN-W5
      - UN-W6
      - UN-W7
    provenance:
    - T01
    - R01
    - R03
    - R04
    evidence_note: 'procedure is forced to `judgment`. The historical gate ran deterministic enumerations (git ls-files, set diffs, lock bijection) AND independent semantic judgment, and the auditor''s PASS turned on the judgment half. enum[deterministic, judgment] admits no mixed value. See PR-GATE-PROCEDURE.

      '
    _approx:
      procedure: PR-GATE-PROCEDURE
  - id: GT-SYNTHESIS
    construct: Gate
    version: 1
    fields:
      subject_rule: the run's REPORT.md and position, together with the goal-owner relevance review
      baseline_rule: the synthesis commit ids posted in the Issue gate-request comment
      eligible_evidence:
      - REPORT.md
      - reports/relevance.md
      - the coverage PASS ruling
      - the graph write disclosure
      missingness_policy: the gap register travels with the recommendation rather than behind it
      independence_predicate: the human owner authored neither the report nor the review
      procedure: judgment
      bar: the directional output is accepted as the run's result and the named dispositions are ruled
      allowed_outcomes:
      - accepted
      - returned
      outcome_consequences:
        accepted: record the verdict, close the Issue, set status done, stop the cycle
        returned: the run stays open for rework of the synthesis
      required_record_category: governance-decision-log
      definition_custodian_ref: AC-OWNER
    relations:
      requires_assessor:
      - RO-OWNER
      bound_by:
      - WF-RESEARCH-SCOPE
      evaluates:
      - UN-SYNTH
      - UN-CLOSE
    provenance:
    - T01
    - R05
  - id: GT-FIREWALL
    construct: Gate
    version: 1
    fields:
      subject_rule: a technology proposed for grade proven, and the artifact attached in proven_by
      baseline_rule: the artifact's own commit or measurement pin
      eligible_evidence:
      - a verified, demonstrated-by-us artifact at the claim's altitude
      missingness_policy: no artifact, no proven; missing evidence is never inferred as success
      independence_predicate: the validator must not be the agent that built the artifact
      procedure: deterministic
      bar: an attached real artifact matching the claim's altitude, demonstrated by the organization
      allowed_outcomes:
      - proven
      - partial
      - rejected
      outcome_consequences:
        proven: grade advances and proven_by is attached
        partial: grade partial
        rejected: no grade movement
      required_record_category: knowledge-node
      definition_custodian_ref: AC-OWNER
    relations:
      requires_assessor:
      - RO-FACTORY-CURATOR
      bound_by:
      - WF-RESEARCH-SCOPE
      evaluates: []
    provenance:
    - T01
    evidence_note: 'NEGATIVE TEST. Bound by the Workflow but never evaluated: feasibility was SKIPPED, no artifact existed, and no instance in this case depends on it. `evaluates: []` is the witness that the case does not rely on the firewall gate.

      '
  EffectBoundary:
  - id: EB-UNIMATRIX
    construct: EffectBoundary
    fields:
      name: Unimatrix knowledge service (MCP server)
      effect_classes:
      - graph-write
      - cycle-write
      custody: server process outside the calling agent; rejects on payload shape and, for context_store/context_correct, on absent identity
      can_refuse: true
    relations:
      enforces: []
    provenance:
    - R05
    - T02
    evidence_note: 'The ONLY boundary in this case with a refusal receipt: five context_cycle phase-end calls were refused (one for a 512-character outcome cap, four for control characters), then one was performed. `enforces: []` is deliberate and load-bearing: the refusals were SCHEMA refusals, not authority refusals. Under I12 the case therefore demonstrates zero enforced authority.

      '
