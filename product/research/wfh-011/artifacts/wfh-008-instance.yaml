registry_extensions:
  unit_kind:
    owner: WF-RESEARCH-SCOPE
    entries:
      research-scope-run:
        definition: one directional/empirical/validated research run over one question
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        - baseline_ref
        status: OPEN
      scope-definition:
        definition: authoring the run boundary, workstream partition, proof bar and coverage rule
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        status: OPEN
      research-workstream:
        definition: one disjoint question-partition producing a FINDINGS record
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        status: OPEN
      coverage-audit:
        definition: independent adjudication of the run's coverage predicates; assessor authored none of the audited work
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        - baseline_ref
        status: OPEN
      pre-distillation-correction:
        definition: removal of false or overstated claims from findings before they are carried into the knowledge graph
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        status: OPEN
      synthesis:
        definition: adjudication of findings into a position plus the run report and the graph writes that carry it
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        status: OPEN
      relevance-review:
        definition: advisory drift/under-reach challenge of the synthesis against the goal
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        status: OPEN
      run-close:
        definition: recording the human verdict, setting run status and stopping telemetry
        workflow_ref: WF-RESEARCH-SCOPE
        required_fields:
        - intended_outcome
        status: OPEN
  record_category:
    owner: SC-PROG
    entries:
      research-scope-definition:
        definition: the fixed boundary, partition, proof bar and coverage rule of one run
        schema_extension:
          status_line: text
          confidence_required: text
          coverage_predicates: list
        admission_rule: admitted by a human advisory scope gate; amendable only by an owner decision Event
        retrieval: by run id
        lifecycle: scoped -> researching -> done
        correction: append-only amendment; the Status line is mutated in place at close
        status: OPEN
      research-finding:
        definition: one workstream's authored evidence-labelled claims over its partition
        schema_extension:
          evidence_labels: list
          workstream: text
        admission_rule: admitted as discovery input only after an independent coverage gate outcome of PASS
        retrieval: by run id and workstream
        lifecycle: authored -> reworked -> corrected -> admitted
        correction: in-place file edit; prior content retained only in the git object store
        status: OPEN
      coverage-audit:
        definition: an independent assessor's per-predicate ruling on a run's coverage
        schema_extension:
          predicate_results: map
          independence_statement: text
          residue_register: list
        admission_rule: assessor must have authored none of the audited work and none of the prior round's audit
        retrieval: by run id and audit round
        lifecycle: issued -> superseded-by-later-round | amended
        correction: append-only amendment inside the same file; earlier verdict retained verbatim
        status: OPEN
      synthesis-report:
        definition: the curator's adjudicated position and directional output for a run
        schema_extension:
          position_ref: text
          gap_register: list
          follow_on: list
        admission_rule: written only after a coverage PASS; accepted only at a human synthesis gate
        retrieval: by run id
        lifecycle: drafted -> accepted | returned
        correction: superseded by a later report; never overwritten after acceptance
        status: OPEN
      relevance-review:
        definition: advisory goal-owner challenge; never mutates and never gates
        schema_extension:
          drift_verdict: text
          under_reach: list
        admission_rule: advisory only; admission is the human's, not the reviewer's
        retrieval: by run id
        lifecycle: issued
        correction: none observed
        status: OPEN
      governance-decision-log:
        definition: the forge-hosted surface on which every gate request and human decision for a run is recorded
        schema_extension:
          issue_number: text
          comment_sequence: list
        admission_rule: publication requires a forge credential; content is authoritative for gates because the method designates the surface, not because comments are true
        retrieval: by issue number
        lifecycle: open -> closed
        correction: new comment; comments are not edited in the observed history
        status: OPEN
      knowledge-node:
        definition: a durable graded knowledge entry in Unimatrix under a configurable category
        schema_extension:
          node_id: text
          node_category: text
          grade_tag: text
          edges: list
        admission_rule: single-writer curator only, after a coverage PASS; grade proven requires an attached artifact
        retrieval: semantic search and typed edge traversal
        lifecycle: active -> deprecated (superseded, id reissued, prior version retained)
        correction: context_correct — deprecates, re-links and reissues the id; history preserved
        status: OPEN
      run-telemetry:
        definition: cycle start/phase-end/stop events carrying run attribution and phase boundaries
        schema_extension:
          topic: text
          tags: list
          phases: map
        admission_rule: accepted by the cycle service on payload conformance; tags are set-once at start
        retrieval: by cycle topic
        lifecycle: started -> phase-ended* -> stopped
        correction: none; point-in-time events are never backfilled
        status: OPEN
      method-definition:
        definition: a protocol, role contract, rule file or skill that governs how work is performed
        schema_extension:
          surface: text
          custodian: text
        admission_rule: none enforced; any actor with repository write can change these files
        retrieval: by repository path
        lifecycle: authored -> revised
        correction: git commit
        status: OPEN
  effect_class:
    owner: SC-COL
    entries:
      worktree-write:
        definition: write a file into the working tree; no durable external effect until committed
        target_schema:
          path: text
        receipt_requirements:
          receipt: none
        status: OPEN
      repo-write:
        definition: create a commit and/or update a remote ref
        target_schema:
          repo: text
          ref: text
        receipt_requirements:
          commit_id: text
          note: content-addressed but not rewrite-proof
        status: OPEN
      forge-write:
        definition: publish or close an Issue/comment on the forge
        target_schema:
          issue: text
        receipt_requirements:
          comment_id: text
          created_at: timestamp
        status: OPEN
      graph-write:
        definition: store, correct, tag or link a Unimatrix knowledge node
        target_schema:
          node_id: text
        receipt_requirements:
          returned_id: text
          status: text
        status: OPEN
      cycle-write:
        definition: emit a run-telemetry cycle event
        target_schema:
          topic: text
          phase: text
        receipt_requirements:
          accepted: bool
          error_text: text
        status: OPEN
  event_type:
    owner: registry
    entries:
      unrecorded_change:
        definition: 'a change to a definition, baseline or composition that occurred without an authorizing decision Event; distinct from adaptation, whose seeded definition requires the change to be authorized and to carry a decision_ref

          '
        required_extension:
        - affected_refs
        - prior_baseline
        - new_baseline
        - authorization_status
        durable: always
        status: OPEN
        admission_justification: 'Two occurrences in the observed history changed governing definitions or pinned baselines with no decision Event: the 2026-08-27 package install that overwrote twelve skill files, and the 2026-08-28 rebase that reissued every wfh-008 commit id. Neither satisfies the seeded adaptation extension, which requires decision_ref. Registered rather than modelled as adaptation so that "authorized" is not asserted where no decision exists. Weakens no common invariant (I19).

          '
