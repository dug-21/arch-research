      custody: git; the pre-rebase commits are on no published branch — workflow/agentic-organization-reframe was deleted on the remote under delete_branch_on_merge:true and survives here only as a stale remote-tracking ref plus a local branch ref
      epistemic_kind: mechanical-observation
      extension:
        affected_refs:
        - RC-COV-R2
        - RC-ISSUE-66
        prior_baseline: '6acc952 0c01522 17ebf2e 7d28294 3cd296d 215942d 962a6c1 017f4fc c29a08f cd03ad0 — the short ids quoted in Issue #66 prose. Not ancestors of main and not on any published branch; resolvable today only via this clone''s local branch ref and via forge retention of the bare oid'
        new_baseline: 7cf95b2 36e35e1 9158a11 cfbedaa 2929599 d9036ae 61b9b1d a595ac7 600471c b847cee — same trees, new commit ids, all ancestors of main. These are the ids wfh-010's R08 ledger pins and the ids this instance uses for every baseline_ref
        authorization_status: authorized-by-role but unrecorded; no decision Event exists
    relations:
      documented_by: []
      caused_by: []
      correlated_with: []
      supersedes: []
    provenance:
    - R06
    evidence_note: 'MEASURED, not inferred. Twelve spread author timestamps against ONE uniform committer timestamp (2026-08-28 14:20:37 -0400) with the author identity preserved and the committer identity dug-21 <angryweed@gmail.com> applied uniformly — the rebase signature — matching a reflog `rebase (finish)` at 2026-08-28 18:20 UTC. `git rev-parse <old>^{tree}` equals `git rev-parse <new>^{tree}` for every pair tested. CORRECTION 1 (2026-08-29): an earlier version asserted that every baseline_ref recorded by wfh-008 no longer resolves on main. RETRACTED. The twelve post-rebase full oids are all ancestors of main; this instance uses those, and needed no change. This extension is a RECORD OF THE REWRITE, not a substitution table. CORRECTION 2 (2026-08-29): a follow-up version asserted the pre-rebase ids survive on a branch PUBLISHED on origin. ALSO RETRACTED — that read a stale local remote-tracking ref as evidence about the remote. `git ls-remote --heads origin` returns nine heads and
      does not include it; `git fetch --prune --dry-run` reports it deleted; delete_branch_on_merge is true. Those ids resolve today only (a) in this clone, via a local branch ref, and (b) through the forge by full oid — two unprotected retention behaviours, not durability. What survives unretracted: the rewrite carries no adaptation Event and git holds no supersession link from the new id to the old. See PR-BASELINE-REWRITE.'
